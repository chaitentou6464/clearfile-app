<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>takami（目標達成マネージャー改）</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="theme-color" content="#1c2230">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#16a34a;--warn:#ea580c;--bad:#dc2626;--sb:#e60012;--px:#d97706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;padding-bottom:86px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 12px}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:38px}
.hrow>:first-child{justify-self:start}.hrow>:last-child{justify-self:end}
.hb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:38px;height:36px;font-size:18px}
.mg{display:flex;align-items:center;gap:8px}.mt{font-size:18px;font-weight:800;white-space:nowrap}
.org{height:32px;padding:0 10px;border:0;border-radius:16px;color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap}
.gear{background:none;border:0;color:#fff;min-width:40px;height:36px;display:flex;align-items:center;justify-content:center}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ttl{font-weight:800;font-size:16px}.sub{color:var(--sub);font-size:13px}
.sect{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;margin:4px 2px 8px}.sect::before{content:'';width:5px;height:18px;border-radius:3px;background:var(--sc,var(--acc))}
.btn{display:block;width:100%;height:48px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:800;margin-top:10px}
.btn:disabled{background:#cbd5e1}.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}.btn.red{background:#fff;color:var(--bad);border:1.5px solid #fecaca}
.mini{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--ink)}
.mini.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.flex{display:flex;align-items:center;gap:8px}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.csec{margin:16px 0 0;padding:6px 10px;border-radius:9px;font-size:14px;font-weight:800;color:#fff}.csec.sb{background:var(--sb)}.csec.px{background:var(--px)}
.ctabs{display:flex;gap:6px;margin-top:10px}
.ctab{flex:1;height:40px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:14.5px;font-weight:800;color:var(--sub)}
.ctab.sb.on{background:var(--sb);border-color:var(--sb);color:#fff}.ctab.px.on{background:var(--px);border-color:var(--px);color:#fff}
.ctab i{font-style:normal;display:inline-block;min-width:18px;height:18px;line-height:18px;margin-left:4px;border-radius:9px;background:var(--acc);color:#fff;font-size:11.5px;padding:0 5px}
.ctab.on i{background:#fff;color:var(--ink)}
.pick{display:flex;align-items:center;gap:8px;margin-top:10px}.pick .pl{flex:none;min-width:96px;white-space:nowrap;font-size:13px;font-weight:800;color:var(--sub)}
.pick select{flex:1;min-width:0;height:42px;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:0 10px;font-size:15px;font-weight:700;color:var(--ink)}
.chip.on.auto{border-style:dashed;background:#f4f5f7;color:var(--sub);border-color:var(--line)}.chip.on.auto small{color:var(--sub)}
.grp{font-size:12.5px;font-weight:800;color:var(--sub);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 12px;font-size:14.5px;font-weight:700;color:var(--ink)}
.chip.on{border-color:var(--acc);background:#eaf1ff;color:var(--acc)}
.chip small{font-weight:600;color:var(--sub);margin-left:4px}.chip.on small{color:var(--acc)}
.dayrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}.dayrow .dt{font-weight:800;font-size:17px;min-width:150px;text-align:center}
.prev{background:#f8fafc;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13.5px;line-height:1.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:7px;margin:2px 3px 0 0;background:#f1f5f9;color:#334155}
.tag.sb{background:#fff1f2;color:var(--sb)}.tag.px{background:#fff7ed;color:var(--px)}
.big{font-size:28px;font-weight:800}.big small{font-size:13px;color:var(--sub);margin-left:2px}
.bar{height:10px;background:#eef0f3;border-radius:6px;position:relative;overflow:hidden;margin:6px 0 4px}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--acc)}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.seg{display:flex;background:#e9ecf1;border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;color:var(--sub)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.kv div{background:#f8fafc;border-radius:10px;padding:7px 8px}.kv span{display:block;font-size:11.5px;color:var(--sub)}.kv b{font-size:15px}
.field{margin-top:10px}.field label{display:block;font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:4px}
.field input,.field select,.field textarea,.inp{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
textarea.inp,.field textarea{height:auto;padding:8px 10px;line-height:1.5;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ihead{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:11px 0;border-top:1px solid var(--line);text-align:left;gap:8px}
.ihead:first-of-type{border-top:0}.ihead .chev{color:var(--acc);font-size:13px;white-space:nowrap}
.ibody{background:#f8fafc;border-radius:12px;padding:4px 12px 12px;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .w{text-align:center;font-size:12px;color:var(--sub);font-weight:700;padding:4px 0}
.cal button{height:58px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px 2px;display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink)}
.cal button.off{background:#f1f5f9;color:#94a3b8}.cal button.tdy{border-color:var(--acc);border-width:2px}.cal button.sel{background:var(--ink);color:#fff}
.cal button small{font-size:10.5px;color:var(--px);font-weight:700;margin-top:2px}.cal button.sel small{color:#fde68a}
.cal button i{font-style:normal;font-size:10px;color:var(--sb)}.cal button.sel i{color:#fecaca}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:#94a3b8;font-weight:700;padding:4px 0}
nav button.on{color:var(--acc)}nav svg{width:24px;height:24px}
.empty{text-align:center;color:var(--sub);padding:18px 6px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.lnk{display:flex;gap:6px;align-items:center;margin-top:6px}.lnk select{flex:3;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 6px;background:#fff;min-width:0}.lnk input{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 6px;min-width:0;width:56px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<nav id="nv"></nav>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
'use strict';
// ===================== 基本 =====================
const LS='takami_v2';
const WD='日月火水木金土';
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const NOW=new Date(),todayKey=dkey(NOW),curYM=todayKey.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n)||0;return (Math.round(n*10)/10).toLocaleString('ja-JP');};
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
const numB=v=>v===''||v==null||!Number.isFinite(Number(v))?'':Number(v);
const str=(v,m=60)=>String(v??'').slice(0,m);
const ID_RE=/^[A-Za-z0-9_-]{1,40}$/,DAY_RE=/^\d{4}-\d{2}-\d{2}$/,YM_RE=/^\d{4}-\d{2}$/;
const cid=v=>ID_RE.test(String(v??''))?String(v):uid();
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const dOf=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));
const addDay=(k,n)=>{const d=dOf(k);d.setDate(d.getDate()+n);return dkey(d);};
const dayLabel=k=>`${+k.slice(5,7)}月${+k.slice(8,10)}日（${WD[dOf(k).getDay()]}）`;
const ymLabel=ym=>`${ym.slice(0,4)}年${+ym.slice(5,7)}月`;
const norm=s=>String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();

// ===================== データ =====================
function blank(){return{v:2,sb:[],px:[],ptCut:'',inp:[],months:{},logs:{},notes:{},off:[]};}
function sanitize(D){
  if(!D||typeof D!=='object'||Array.isArray(D))D={};
  const o=blank(),A=a=>Array.isArray(a)?a:[];
  const tg=g=>({fixed:!!(g&&g.fixed),value:numB(g&&g.value)});
  o.sb=A(D.sb).filter(x=>x&&typeof x==='object').slice(0,80).map(x=>({id:cid(x.id),name:str(x.name),kind:x.kind==='rate'?'rate':'cnt',den:ID_RE.test(String(x.den||''))?String(x.den):'',
    hai:numB(x.hai),note:str(x.note,300),tiers:A(x.tiers).filter(t=>t&&typeof t==='object').slice(0,20).map(t=>({id:cid(t.id),p:numB(t.p),pt:numB(t.pt)})),goal:tg(x.goal)}));
  o.px=A(D.px).filter(x=>x&&typeof x==='object').slice(0,80).map(x=>({id:cid(x.id),name:str(x.name),grp:str(x.grp,30),sbl:ID_RE.test(String(x.sbl||''))?String(x.sbl):'',unit:str(x.unit,10),pt:numB(x.pt),mode:x.mode==='yen'?'yen':'cnt',
    subs:A(x.subs).filter(s=>s&&typeof s==='object').slice(0,30).map(s=>({id:cid(s.id),name:str(s.name),pt:numB(s.pt),cut:!!s.cut})),cut:tg(x.cut),goal:tg(x.goal)}));
  o.ptCut=numB(D.ptCut);
  o.inp=A(D.inp).filter(x=>x&&typeof x==='object').slice(0,150).map(x=>({id:cid(x.id),name:str(x.name),grp:str(x.grp,30),cat:x.cat==='sb'||x.cat==='px'?x.cat:'',link:x.link==='none'||ID_RE.test(String(x.link||''))?String(x.link||''):'',
    sb:A(x.sb).filter(l=>l&&ID_RE.test(String(l.i))).slice(0,10).map(l=>({i:String(l.i),q:numB(l.q)===''?1:num(l.q)})),
    px:A(x.px).filter(l=>l&&ID_RE.test(String(l.i))).slice(0,10).map(l=>{const r={i:String(l.i),q:numB(l.q)===''?1:num(l.q)};if(l.s&&ID_RE.test(String(l.s)))r.s=String(l.s);return r;})}));
  const M=D.months&&typeof D.months==='object'?D.months:{};
  for(const ym in M){if(!YM_RE.test(ym))continue;const t=(M[ym]||{}).t||{},ot={};for(const i in t){if(!ID_RE.test(i))continue;const v=t[i]||{},r={};if('cut' in v)r.cut=numB(v.cut);if('goal' in v)r.goal=numB(v.goal);ot[i]=r;}o.months[ym]={t:ot};}
  const L=D.logs&&typeof D.logs==='object'?D.logs:{};
  for(const k in L){if(!DAY_RE.test(k)||!Array.isArray(L[k]))continue;const a=L[k].filter(r=>r&&typeof r==='object'&&Array.isArray(r.x)).slice(0,300).map(r=>{const y={};for(const i in (r.y||{}))if(ID_RE.test(i))y[i]=Math.max(0,num(r.y[i]));
    return{id:cid(r.id),ts:num(r.ts),n:Math.max(1,Math.min(99,Math.round(num(r.n)||1))),x:r.x.filter(i=>ID_RE.test(String(i))).map(String).slice(0,40),y};}).filter(r=>r.x.length);if(a.length)o.logs[k]=a;}
  const N=D.notes&&typeof D.notes==='object'?D.notes:{};
  for(const k in N){if(!DAY_RE.test(k))continue;const v=N[k]||{},r={memo:str(v.memo,3000),mgr:str(v.mgr,3000),bu:str(v.bu,3000)};if(r.memo||r.mgr||r.bu)o.notes[k]=r;}
  o.off=A(D.off).filter(k=>typeof k==='string'&&DAY_RE.test(k));
  return o;
}
let S;try{S=sanitize(JSON.parse(localStorage.getItem(LS)||'null'));}catch(e){S=blank();}
let saveFail=false;
function save(){try{localStorage.setItem(LS,JSON.stringify(S));saveFail=false;}catch(e){saveFail=true;toast('保存できませんでした（容量がいっぱいかもしれません）');}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800);}

const sbById=id=>S.sb.find(x=>x.id===id),pxById=id=>S.px.find(x=>x.id===id),inpById=id=>S.inp.find(x=>x.id===id);
const subOf=(it,s)=>it&&s?(it.subs||[]).find(x=>x.id===s):null;
const pxPt=(it,s)=>{const x=subOf(it,s);return num(x?x.pt:it.pt);};
const pxLabel=(it,s)=>{const x=subOf(it,s);return (it.name||'名前なし')+(x?'（'+(x.name||'種類')+'）':'');};
function tval(ym,it,k){const g=it[k];if(!g)return '';if(g.fixed)return g.value;const t=((S.months[ym]||{}).t||{})[it.id]||{};return t[k]??'';}
function setT(ym,it,k,v){if(it[k].fixed){it[k].value=v;return;}const m=S.months[ym]=S.months[ym]||{t:{}};(m.t[it.id]=m.t[it.id]||{})[k]=v;}
function inpPt(inp){return (inp.px||[]).reduce((a,l)=>{const it=pxById(l.i);return a+(it?pxPt(it,l.s)*num(l.q):0);},0);}

// ===================== 集計 =====================
function agg(from,to){
  const r={sb:{},px:{},pxSub:{},pxCut:{},yen:{},pts:0,recs:0};
  for(const k in S.logs){if(k<from||k>to)continue;for(const rec of S.logs[k]){r.recs++;
    for(const iid of rec.x){const inp=inpById(iid);if(!inp)continue;
      for(const l of inp.sb){r.sb[l.i]=(r.sb[l.i]||0)+rec.n*num(l.q);}
      for(const l of inp.px){const it=pxById(l.i);if(!it)continue;const q=rec.n*num(l.q);r.px[l.i]=(r.px[l.i]||0)+q;
        if(l.s){const key=l.i+'|'+l.s;r.pxSub[key]=(r.pxSub[key]||0)+q;}
        const cs=(it.subs||[]).filter(x=>x.cut).map(x=>x.id);if(!cs.length||cs.includes(l.s))r.pxCut[l.i]=(r.pxCut[l.i]||0)+q;
        if(it.mode==='yen')r.yen[l.i]=(r.yen[l.i]||0)+num(rec.y[iid]);
        r.pts+=q*pxPt(it,l.s);}}}}
  return r;
}
function recPt(rec){let t=0;for(const iid of rec.x){const inp=inpById(iid);if(inp)t+=rec.n*inpPt(inp);}return t;}
function tierOf(it,pct){const T=(it.tiers||[]).filter(t=>t.p!==''&&t.p!=null).map(t=>({p:num(t.p),pt:num(t.pt)})).sort((a,b)=>a.p-b.p);
  let cur=null;if(pct!=null)for(const t of T)if(pct>=t.p-1e-9)cur=t;const nx=pct==null?T[0]||null:T.find(t=>t.p>pct+1e-9)||null;return{T,cur,nx};}
function sbStat(it,A,ym){
  const n=A.sb[it.id]||0;
  if(it.kind==='rate'){const den=A.sb[it.den]||0,pct=den?n/den*100:null,tr=tierOf(it,pct);let need=null;
    if(tr.nx){const q=tr.nx.p/100;need=q>=1?null:Math.max(0,Math.ceil((q*den-n)/(1-q)-1e-9));}
    return{n,den,pct,tr,need};}
  const g=ym?num(tval(ym,it,'goal')):0,pct=g?n/g*100:null,tr=tierOf(it,pct);let need=null;if(tr.nx&&g)need=Math.max(0,Math.ceil(tr.nx.p/100*g-n-1e-9));
  return{n,goal:g,pct,tr,need};
}
function monthWork(ym){const n=daysIn(ym),out=[];for(let d=1;d<=n;d++){const k=ym+'-'+pad(d);if(!S.off.includes(k))out.push(k);}return out;}
function remWork(ym){const w=monthWork(ym);if(ym<curYM)return 0;if(ym>curYM)return w.length;return w.filter(k=>k>=todayKey).length;}
function elWork(ym){const w=monthWork(ym);if(ym<curYM)return w.length;if(ym>curYM)return 0;return w.filter(k=>k<=todayKey).length;}

// ===================== 画面の状態 =====================
const view={tab:'in',day:todayKey,ym:curYM,org:'sb',range:'month',from:curYM+'-01',to:todayKey,cday:todayKey,open:null,del:null};
let sel={},selN=1,selY={},selA={};

// ===================== アイコン =====================
const IC={
 in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 res:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
 pts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M3 9h18"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

function render(){
  const T=view.tab,showOrg=T==='res'||T==='pts',showMonth=(T==='res'&&view.range==='month')||T==='cal';
  const org=view.org==='px'?'<button class="org" style="background:var(--px)" data-a="org">フェニックス ⇄</button>':'<button class="org" style="background:var(--sb)" data-a="org">ソフトバンク ⇄</button>';
  document.getElementById('hd').innerHTML=`<div class="hrow">${showOrg?org:'<span></span>'}
    ${showMonth?`<div class="mg"><button class="hb" data-a="mprev" aria-label="前の月">‹</button><div class="mt">${ymLabel(view.ym)}</div><button class="hb" data-a="mnext" aria-label="次の月">›</button></div>`:`<div class="mt">${T==='set'?'項目設定':'takami'}</div>`}
    <button class="gear" data-a="${T==='set'?'back':'gear'}" aria-label="項目設定">${T==='set'?'<span style="font-size:15px;font-weight:700;white-space:nowrap;padding:0 4px">閉じる</span>':IC.gear}</button></div>`;
  let h='';
  if(T==='in')h=inView();else if(T==='res')h=resView();else if(T==='pts')h=ptsView();else if(T==='cal')h=calView();else h=setView();
  document.getElementById('app').innerHTML=h;
  document.getElementById('nv').innerHTML=[['in','入力'],['res','実績確認'],['pts','ポイント'],['cal','カレンダー']].map(([k,l])=>`<button data-tab="${k}" class="${T===k?'on':''}">${IC[k]}${l}</button>`).join('');
}
const noSetup=()=>`<div class="card empty">まだ入力ボタンがありません。<br>右上の⚙「項目設定」で設定ファイルを読み込むと、ここに並びます。<button class="btn" data-a="gear">項目設定を開く</button></div>`;

const catOf=x=>x.cat==='sb'||x.cat==='px'?x.cat:(x.grp==='フェニックス'||(!x.sb.length&&x.px.length))?'px':'sb';
const sbGroups=()=>[...new Set(S.inp.filter(x=>catOf(x)==='sb').map(x=>x.grp||'その他'))];
const grpName=x=>{if(catOf(x)!=='px')return x.grp||'その他';{const L=x.link&&x.link!=='none'?x.link:pxSbl(x),z=L&&inpById(L);if(z)return z.grp||'その他';}if(x.grp&&x.grp!=='フェニックス'&&x.grp!=='その他')return x.grp;for(const l of x.px){const it=pxById(l.i);if(it&&it.grp)return it.grp;}return x.grp||'フェニックス';};
const nm=v=>String(v||'').replace(/[\s　]/g,'').toLowerCase();
const covered=(x,y)=>y.px.length&&y.px.every(l=>x.px.some(m=>m.i===l.i&&(m.s||'')===(l.s||'')));
// SBのボタンxに連動するフェニックスのボタン（設定で指定、なければ同じ名前）
// フェニックスのボタンがつながるソフトバンクのボタン：ボタンの設定 → 項目の「大項目・小項目」 → 同じ名前
const pxSbl=y=>{for(const l of y.px){const it=pxById(l.i);if(it&&it.sbl&&inpById(it.sbl))return it.sbl;}return '';};
const linkedOf=x=>catOf(x)!=='sb'?[]:S.inp.filter(y=>{if(y===x||catOf(y)!=='px'||y.link==='none')return false;const L=y.link||pxSbl(y);return L?L===x.id:nm(y.name)&&nm(y.name)===nm(x.name);});
function incMap(){const m={};S.inp.forEach(x=>{if(sel[x.id])linkedOf(x).forEach(y=>{if(covered(x,y)&&!sel[y.id])m[y.id]=x.id;});});return m;}
function toggleSel(id){const x=inpById(id);if(!x)return;
  if(sel[id]){delete sel[id];delete selA[id];Object.keys(selA).forEach(k=>{if(selA[k]===id){delete sel[k];delete selA[k];}});return;}
  sel[id]=1;
  if(catOf(x)==='sb')linkedOf(x).forEach(y=>{if(!covered(x,y)&&!sel[y.id]){sel[y.id]=1;selA[y.id]=id;}});
  else S.inp.filter(z=>linkedOf(z).includes(x)).forEach(z=>{ // フェニックスで選んだらソフトバンクにも反映
    if(!sel[z.id]){sel[z.id]=1;selA[z.id]=id;}
    if(covered(z,x)){delete sel[id];if(selA[z.id]===id)delete selA[z.id];}});}
// ---------- タブ1：入力 ----------
function inView(){
  const k=view.day;
  let h=`<div class="dayrow"><button class="mini" data-a="dprev" aria-label="前の日">‹</button><div class="dt">${dayLabel(k)}</div><button class="mini" data-a="dnext" aria-label="次の日">›</button>${k!==todayKey?'<button class="mini" data-a="dtoday">今日</button>':''}</div>`;
  if(!S.inp.length)return h+noSetup();
  const cats=[['sb','ソフトバンク'],['px','フェニックス']].filter(([c])=>S.inp.some(x=>catOf(x)===c));
  const grpOf=c=>{const G=[];S.inp.filter(x=>catOf(x)===c).forEach(x=>{const g=grpName(x);let v=G.find(w=>w[0]===g);if(!v)G.push(v=[g,[]]);v[1].push(x);});if(c==='px'){const o=sbGroups(),r=g=>{const i=o.indexOf(g);return i<0?999:i;};G.sort((a,b)=>r(a[0])-r(b[0]));}return G;};
  const inc=incMap();
  const chosen=S.inp.filter(x=>sel[x.id]);
  let pt=0;const sbc={},pxs=[];chosen.forEach(x=>{pt+=selN*inpPt(x);x.sb.forEach(l=>{sbc[l.i]=(sbc[l.i]||0)+selN*num(l.q);});x.px.forEach(l=>{const it=pxById(l.i);if(it)pxs.push(pxLabel(it,l.s));});});
  const yenSel=chosen.filter(x=>x.px.some(l=>{const it=pxById(l.i);return it&&it.mode==='yen';}));
  h+=`<div class="card"><div class="between"><div class="ttl">1件の獲得を入力</div>${chosen.length?'<button class="mini" data-a="clr">選び直す</button>':''}</div>
    <div class="sub">上から順に選んで、最後に「登録」を1回押します。ソフトバンクとかぶるフェニックスの項目は自動で入ります。</div>
    ${cats.map(([cc,lab])=>{const groups=grpOf(cc);return `<div class="csec ${cc}">【${lab}】</div>${cc==='px'?groups.map(([g,cur])=>`${groups.length>1?`<div class="grp">（${esc(g)}）</div>`:'<div style="height:10px"></div>'}<div class="chips">${cur.map(x=>{const p=inpPt(x);return inc[x.id]?`<span class="chip on auto">${esc(x.name)}<small>ソフトバンクで入力済</small></span>`:`<button class="chip ${sel[x.id]?'on':''}" data-a="chip" data-id="${x.id}">${sel[x.id]?'✓ ':''}${esc(x.name||'名前なし')}${selA[x.id]?'<small>自動</small>':p?`<small>${fmt(p)}pt</small>`:''}</button>`;}).join('')}</div>`).join(''):groups.map(([g,cur])=>{const on=cur.filter(x=>sel[x.id]||inc[x.id]);return `<div class="pick"><div class="pl">（${esc(g)}）</div><select data-a="pick"><option value="">${on.length?'＋ 追加／外す':'選んでください'}</option>${cur.map(x=>{const p=inpPt(x);return `<option value="${x.id}" ${inc[x.id]?'disabled':''}>${sel[x.id]||inc[x.id]?'✓ ':''}${esc(x.name||'名前なし')}${p?`（${fmt(p)}pt）`:''}</option>`;}).join('')}</select></div>
      ${on.length?`<div class="chips" style="margin:6px 0 2px">${on.map(x=>inc[x.id]?`<span class="chip on auto">${esc(x.name)}<small>ソフトバンクで入力済</small></span>`:`<button class="chip on" data-a="chip" data-id="${x.id}">${esc(x.name||'名前なし')}${selA[x.id]?'<small>自動</small>':''} ✕</button>`).join('')}</div>`:''}`;}).join('')}`;}).join('')}
    ${yenSel.map(x=>`<div class="field"><label>${esc(x.name)}の金額（円）</label><input type="number" inputmode="numeric" data-a="yen" data-id="${x.id}" value="${selY[x.id]??''}" placeholder="例：3000"></div>`).join('')}
    <div class="prev">${chosen.length?`<div><b>ソフトバンク</b>　${Object.keys(sbc).map(i=>{const it=sbById(i);return it?`<span class="tag sb">${esc(it.name)} +${fmt(sbc[i])}</span>`:'';}).join('')||'<span class="sub">数える項目なし</span>'}</div>
      <div><b>フェニックス</b>　${pxs.map(n=>`<span class="tag px">${esc(n)}</span>`).join('')||'<span class="sub">項目なし</span>'}　<b style="color:var(--px)">${fmt(pt)}pt</b></div>`:'<span class="sub">上のボタンから選んでください</span>'}</div>
    <div class="flex" style="margin-top:10px"><span class="sub" style="white-space:nowrap">同じ内容を</span><select id="selN" class="inp" style="width:90px">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${selN===i+1?'selected':''}>${i+1}件</option>`).join('')}</select>
      <button class="btn" data-a="reg" style="margin-top:0;flex:1" ${chosen.length?'':'disabled'}>登録</button></div></div>`;
  const L=S.logs[k]||[];let dayPt=0;const dsb={};
  const rows=L.map(r=>{const p=recPt(r);dayPt+=p;r.x.forEach(i=>{const inp=inpById(i);if(inp)inp.sb.forEach(l=>{dsb[l.i]=(dsb[l.i]||0)+r.n*num(l.q);});});
    const names=r.x.map(i=>{const inp=inpById(i);return inp?esc(inp.name)+(r.y[i]?`（${fmt(r.y[i])}円）`:''):'（削除した項目）';}).join('・');
    const t=r.ts?new Date(r.ts):null;
    return `<div class="row"><div style="min-width:0"><div><b>${names}</b>${r.n>1?` ×${r.n}`:''}</div><div class="sub">${t?pad(t.getHours())+':'+pad(t.getMinutes()):''}</div></div>
      <div class="flex" style="flex:none"><b style="color:var(--px)">${fmt(p)}pt</b><button class="mini" data-a="rdel" data-id="${r.id}" style="color:var(--bad)">${view.del===r.id?'削除':'✕'}</button></div></div>`;}).join('');
  h+=`<div class="card"><div class="between"><div class="ttl">この日の入力</div><div class="big" style="color:var(--px)">${fmt(dayPt)}<small>pt</small></div></div>
    ${Object.keys(dsb).length?`<div style="margin:4px 0 6px">${Object.keys(dsb).map(i=>{const it=sbById(i);return it?`<span class="tag sb">${esc(it.name)} ${fmt(dsb[i])}</span>`:'';}).join('')}</div>`:''}
    ${rows||'<div class="sub" style="padding:8px 0">まだ入力がありません</div>'}</div>`;
  return h;
}

// ---------- タブ2：実績確認 ----------
function rangeOf(){if(view.range==='month'){const ym=view.ym;return[ym+'-01',ym+'-'+pad(daysIn(ym)),ym];}let f=view.from,t=view.to;if(f>t)[f,t]=[t,f];return[f,t,null];}
function bar(pct,cutPct){return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,pct||0))}%;${(pct||0)>=100?'background:var(--ok)':''}"></i>${cutPct!=null?`<b style="left:${Math.min(99,cutPct)}%"></b>`:''}</div>`;}
function resView(){
  const[f,t,ym]=rangeOf(),A=agg(f,t);
  let h=`<div class="seg"><button data-a="rng" data-v="month" class="${view.range==='month'?'on':''}">月間</button><button data-a="rng" data-v="span" class="${view.range==='span'?'on':''}">期間指定</button></div>`;
  if(!ym)h+=`<div class="card"><div class="r2"><div class="field" style="margin-top:0"><label>はじめ</label><input type="date" data-a="from" value="${f}"></div><div class="field" style="margin-top:0"><label>おわり</label><input type="date" data-a="to" value="${t}"></div></div>
    <div class="flex wrap" style="margin-top:8px">${[['今週',0],['先週',-7],['直近30日',30]].map(([l,v])=>`<button class="mini" data-a="quick" data-v="${v}">${l}</button>`).join('')}</div></div>`;
  const span=ym?`${ymLabel(ym)}`:`${dayLabel(f)}〜${dayLabel(t)}`;
  if(view.org==='px')return h+pxRes(A,ym,span);
  return h+sbRes(A,ym,span);
}
function sbRes(A,ym,span){
  if(!S.sb.length)return `<div class="sect" style="--sc:var(--sb)">ソフトバンク</div>`+noSetup();
  let tot=0,hai=0;const rows=S.sb.map(it=>{const s=sbStat(it,A,ym);if(s.tr.cur)tot+=s.tr.cur.pt;hai+=num(it.hai);
    const pctTxt=s.pct==null?'—':fmt(Math.floor(s.pct*10)/10)+'%';
    const main=it.kind==='rate'?`${fmt(s.n)}／${fmt(s.den)}件`:`${fmt(s.n)}件${s.goal?`／計画 ${fmt(s.goal)}`:''}`;
    const den=it.kind==='rate'?sbById(it.den):null;
    return `<div class="row" style="display:block"><div class="between"><div><b>${esc(it.name)}</b>${it.hai!==''?`<span class="sub">　配点${fmt(it.hai)}</span>`:''}</div><b>${it.kind==='rate'||s.goal?pctTxt:fmt(s.n)+'件'}</b></div>
      ${it.kind==='rate'||s.goal?bar(s.pct):''}
      <div class="between sub"><span>${main}${den?`（÷${esc(den.name)}）`:''}</span><span>${s.tr.T.length?`${s.tr.cur?`<b style="color:var(--sb)">${fmt(s.tr.cur.pt)}点</b>`:'0点'}${s.tr.nx?`・あと${s.need==null?'—':s.need}件で${fmt(s.tr.nx.pt)}点`:''}`:''}</span></div></div>`;}).join('');
  return `<div class="sect" style="--sc:var(--sb)">ソフトバンク</div>
    <div class="card"><div class="sub">${span}</div><div class="between" style="margin-top:4px"><span class="sub">段階を入れた項目の点数</span><div class="big" style="color:var(--sb)">${fmt(tot)}<small>点${hai?` ／ 配点 ${fmt(hai)}`:''}</small></div></div>
    <div class="sub" style="margin-top:4px">率の項目は「獲得した日」で数えています。実際の評価はN+2月1日時点の歩留りなどで決まるので、目安として見てください。</div></div>
    <div class="card">${rows}</div>`;
}
function pxRes(A,ym,span){
  if(!S.px.length)return `<div class="sect" style="--sc:var(--px)">フェニックス</div><div class="card empty">フェニックスの項目がありません。<br>⚙の「前のアプリから読み込む」で入れられます。<button class="btn" data-a="gear">項目設定を開く</button></div>`;
  const rem=ym?remWork(ym):0,el=ym?elWork(ym):0,work=ym?monthWork(ym).length:0,pc=num(S.ptCut);
  let h=`<div class="sect" style="--sc:var(--px)">フェニックス</div><div class="card"><div class="sub">${span}・入力 ${A.recs}件</div><div class="between" style="margin-top:4px"><span class="sub">合計ポイント</span><div class="big" style="color:var(--px)">${fmt(A.pts)}<small>pt</small></div></div>
    ${ym&&pc?`${bar(A.pts/pc*100)}<div class="between sub"><span>ポイント足切り ${fmt(pc)}pt</span><span>${A.pts>=pc?'<b style="color:var(--ok)">クリア</b>':`あと${fmt(pc-A.pts)}pt${rem?`・1日 ${fmt(Math.ceil((pc-A.pts)/rem))}pt`:''}`}</span></div>`:''}</div>`;
  h+=S.px.map(it=>{const n=A.px[it.id]||0,cutV=it.mode==='yen'?(A.yen[it.id]||0):(A.pxCut[it.id]||0),u=it.mode==='yen'?'件':(it.unit||'件');
    const cut=ym?num(tval(ym,it,'cut')):0,goal=ym?num(tval(ym,it,'goal')):0,cu=it.mode==='yen'?'円':u;
    const subs=(it.subs||[]).map(s=>`<span class="tag">${esc(s.name||'種類')} ${fmt(A.pxSub[it.id+'|'+s.id]||0)}</span>`).join('');
    const pts=(()=>{let p=0;if((it.subs||[]).length)it.subs.forEach(s=>{p+=(A.pxSub[it.id+'|'+s.id]||0)*num(s.pt);});const noSub=n-(it.subs||[]).reduce((a,s)=>a+(A.pxSub[it.id+'|'+s.id]||0),0);p+=noSub*num(it.pt);return p;})();
    const land=ym&&el?n/el*work:null;
    return `<div class="card"><div class="between"><b style="font-size:16px">${esc(it.name||'名前なし')}</b><span><b style="font-size:22px">${fmt(n)}</b><span class="sub">${esc(u)}・${fmt(pts)}pt</span></span></div>
      ${subs||it.mode==='yen'?`<div style="margin-top:4px">${it.mode==='yen'?`<span class="tag">合計 ${fmt(cutV)}円</span>`:''}${subs}</div>`:''}
      ${ym&&(cut||goal)?`${bar(goal?n/goal*100:cutV/cut*100,goal&&cut&&it.mode!=='yen'?cut/goal*100:null)}
        <div class="kv">${cut?`<div><span>足切り ${fmt(cut)}${esc(cu)}</span><b style="color:${cutV>=cut?'var(--ok)':'var(--bad)'}">${cutV>=cut?'クリア':'あと'+fmt(cut-cutV)}</b></div>`:''}
        ${goal?`<div><span>目標 ${fmt(goal)}${esc(u)}</span><b>${n>=goal?'<span style="color:var(--ok)">達成</span>':'あと'+fmt(goal-n)}</b></div>`:''}
        ${(()=>{const need=goal>n?goal-n:cut>cutV?cut-cutV:0,nu=goal>n?u:cu;return rem&&need>0?`<div><span>1日あたり</span><b>${fmt(Math.ceil(need/rem))}${esc(nu)}</b></div>`:land!=null?`<div><span>着地予測</span><b>${fmt(land)}</b></div>`:'';})()}</div>`:''}</div>`;}).join('');
  return h;
}

// ---------- タブ3：ポイント ----------

    const L=S.inp.map(x=>({x,p:inpPt(x)})).sort((a,b)=>b.p-a.p);const max=L.length?Math.max(1,L[0].p):1;

      ${L.map(({x,p})=>`<button class="ihead" data-a="ptgo" data-id="${x.id}"><span style="flex:1;min-width:0"><b>${esc(x.name)}</b>
        <span class="bar" style="display:block;margin:5px 0 3px"><i style="width:${Math.max(2,p/max*100)}%;background:var(--px)"></i></span>
        <span class="sub">${x.sb.map(l=>{const it=sbById(l.i);return it?`<span class="tag sb">${esc(it.name)}</span>`:'';}).join('')}</span></span><b style="color:var(--px);font-size:18px">${fmt(p)}<small class="sub">pt</small></b></button>`).join('')}</div>`;
  }
  return `<div class="sect" style="--sc:var(--sb)">ソフトバンク</div>`+S.sb.map(it=>{const tr=tierOf(it,null),by=S.inp.filter(x=>x.sb.some(l=>l.i===it.id)),den=it.kind==='rate'?sbById(it.den):null;
    return `<div class="card"><div class="between"><b style="font-size:16px">${esc(it.name)}</b>${it.hai!==''?`<b style="color:var(--sb)">配点 ${fmt(it.hai)}</b>`:''}</div>
      <div class="sub">${it.kind==='rate'?`率：入力した件数 ÷ ${esc(den?den.name:'（分母が未設定）')}`:'計画値に対する達成率'}${it.note?'・'+esc(it.note):''}</div>
      ${tr.T.length?`<div class="flex wrap" style="margin-top:6px">${tr.T.map(t=>`<span class="tag">${fmt(t.p)}%以上 ${fmt(t.pt)}点</span>`).join('')}</div>`:''}
      <div style="margin-top:6px">${by.length?by.map(x=>`<span class="tag sb">${esc(x.name)}</span>`).join(''):'<span class="sub">数える入力ボタンがありません</span>'}</div></div>`;}).join('');
}

// ---------- タブ4：カレンダー・報告 ----------
function calView(){

function moveDel(kind,id,i,n){return `<div class="flex" style="margin-top:10px;justify-content:flex-end"><button class="mini" data-a="mv" data-kind="${kind}" data-id="${id}" data-v="-1" ${i===0?'disabled':''}>↑</button><button class="mini" data-a="mv" data-kind="${kind}" data-id="${id}" data-v="1" ${i===n-1?'disabled':''}>↓</button><button class="mini" data-a="del" data-kind="${kind}" data-id="${id}" style="color:var(--bad)">${view.del===id?'本当に削除':'削除'}</button></div>`;}

function pxFromOld(items,ptCut,t){ // 前のアプリ（目標達成マネージャー）の項目をフェニックスへ
  const cs=sanitize({px:(items||[]).map(x=>({...x,mode:x.cut&&x.cut.mode==='yen'?'yen':'cnt'}))}).px;
  const byName={};S.px.forEach(p=>byName[norm(p.name)]=p);const idMap={};
  S.px=cs.map((x,i)=>{const ex=byName[norm(x.name)];const oid=(items[i]||{}).id;if(ex){x.id=ex.id;x.subs=x.subs.map(s=>{const es=(ex.subs||[]).find(v=>norm(v.name)===norm(s.name));if(es)s.id=es.id;return s;});}idMap[String(oid)]=x.id;return x;});
  if(ptCut!==undefined)S.ptCut=numB(ptCut);
  for(const ym in (t||{})){if(!YM_RE.test(ym))continue;for(const oid in t[ym]){const id=idMap[oid];if(!id)continue;const m=S.months[ym]=S.months[ym]||{t:{}};m.t[id]=Object.assign(m.t[id]||{},{cut:numB(t[ym][oid].cut),goal:numB(t[ym][oid].goal)});}}
  linkPx();
}
function linkPx(){ // フェニックスの項目を入力ボタンにつなぐ（同じ名前のボタンがあればそこへ、なければボタンを作る）
  const has=new Set();S.inp.forEach(x=>x.px=x.px.filter(l=>{const it=pxById(l.i);return it&&(!l.s||subOf(it,l.s));}));
  S.inp.forEach(x=>x.px.forEach(l=>has.add(l.i+'|'+(l.s||''))));
  S.px.forEach(it=>{const targets=(it.subs||[]).length?it.subs.map(s=>[s.id,pxLabel(it,s.id),s.name]):[[null,it.name,it.name]];
    targets.forEach(([s,label,sname])=>{const key=it.id+'|'+(s||'');if(has.has(key)||(s&&has.has(it.id+'|')))return;
      const btn=S.inp.find(x=>norm(x.name)===norm(label))||(!s?null:null);
      if(btn&&!btn.px.length){btn.px.push(s?{i:it.id,s,q:1}:{i:it.id,q:1});}
      else S.inp.push({id:uid(),name:label,grp:'フェニックス',cat:'px',sb:[],px:[s?{i:it.id,s,q:1}:{i:it.id,q:1}]});
      has.add(key);});});
}
function applyCfgFile(c){
  const cs=sanitize({sb:c.sb,inp:c.inp,px:c.px||[]});
  const oldInp={};S.inp.forEach(x=>oldInp[norm(x.name)]=x);
  S.sb=cs.sb;
  if(Array.isArray(c.px)&&c.px.length){const byName={};S.px.forEach(p=>byName[norm(p.name)]=p);S.px=cs.px.map(x=>{const ex=byName[norm(x.name)];if(ex)x.id=ex.id;return x;});}
  // ソフトバンク側のつながりはファイルのもの、フェニックス側は今までのものを残す
  const fileInp=cs.inp.map(x=>{const ex=oldInp[norm(x.name)];if(ex){x.id=ex.id;if(!x.px.length)x.px=ex.px;}return x;});
  const fileNames=new Set(fileInp.map(x=>norm(x.name)));
  S.inp=fileInp.concat(S.inp.filter(x=>!fileNames.has(norm(x.name))&&x.px.length));
  if(c.months)for(const ym in c.months){if(!YM_RE.test(ym))continue;const t=(c.months[ym]||{}).t||{};for(const id in t){if(!sbById(id))continue;const m=S.months[ym]=S.months[ym]||{t:{}};m.t[id]=Object.assign(m.t[id]||{},{goal:numB(t[id].goal)});}}
  linkPx();
}
async function decCode(code){
  code=String(code).trim();const kind=code[0];let b=code.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const bin=atob(b),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  let txt;if(kind==='z'){const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));txt=await new Response(st).text();}else txt=new TextDecoder().decode(u8);
  return JSON.parse(txt);
}
let fileMode='cfg';
document.getElementById('fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>3e6){alert('ファイルが大きすぎます');return;}
  let c;try{c=JSON.parse(await f.text());}catch(err){alert('読み込めませんでした。ファイルが壊れているかもしれません。');return;}
  if(fileMode==='bk'){if(!c||c.v!==2||!Array.isArray(c.inp)){alert('takamiのバックアップファイルではありません');return;}
    if(!confirm('今のデータを、このバックアップの内容に置き換えます。よろしいですか？'))return;S=sanitize(c);save();render();toast('バックアップから戻しました');return;}
  if(!c||c.kind!=='takami-cfg'||!Array.isArray(c.sb)||!Array.isArray(c.inp)){alert('takamiの設定ファイルではありません');return;}
  if(!confirm(`設定を読み込みます。\n・ソフトバンクの評価項目 ${c.sb.length}個\n・入力ボタン ${c.inp.length}個${Array.isArray(c.px)&&c.px.length?`\n・フェニックスの項目 ${c.px.length}個`:''}\n\nソフトバンクの項目は置き換わります。入力済みの実績・メモはそのまま残ります。`))return;
  applyCfgFile(c);save();render();toast('読み込みました');
});

// ===================== 操作 =====================
function listOf(kind){return kind==='sb'?S.sb:kind==='px'?S.px:S.inp;}
function findK(kind,id){return listOf(kind).find(x=>x.id===id);}
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){view.tab=tb.dataset.tab;view.del=null;render();window.scrollTo(0,0);return;}
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,id=t.dataset.id;
  if(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')return;
  if(a!=='rdel'&&a!=='del'&&a!=='wipe')view.del=null;
  if(a==='gear'){view.tab='set';view.open=null;render();window.scrollTo(0,0);return;}
  if(a==='back'){view.tab='in';render();return;}
  if(a==='org'){view.org=view.org==='px'?'sb':'px';render();return;}
  if(a==='mprev'||a==='mnext'){const d=new Date(+view.ym.slice(0,4),+view.ym.slice(5,7)-1+(a==='mnext'?1:-1),1);view.ym=d.getFullYear()+'-'+pad(d.getMonth()+1);render();return;}
  if(a==='dprev'||a==='dnext'){view.day=addDay(view.day,a==='dnext'?1:-1);view.ym=view.day.slice(0,7);render();return;}
  if(a==='dtoday'){view.day=todayKey;view.ym=curYM;render();return;}
  if(a==='chip'){toggleSel(id);render();return;}
  if(a==='clr'){sel={};selY={};selA={};selN=1;render();return;}
  if(a==='reg'){const x=S.inp.filter(v=>sel[v.id]).map(v=>v.id);if(!x.length)return;const y={};x.forEach(i=>{if(selY[i])y[i]=num(selY[i]);});
    (S.logs[view.day]=S.logs[view.day]||[]).push({id:uid(),ts:Date.now(),n:selN,x,y});save();sel={};selY={};selA={};selN=1;render();toast('登録しました');return;}
  if(a==='rdel'){if(view.del!==id){view.del=id;render();return;}const L=S.logs[view.day]||[];const i=L.findIndex(r=>r.id===id);if(i>=0)L.splice(i,1);if(!L.length)delete S.logs[view.day];view.del=null;save();render();return;}
  if(a==='rng'){view.range=t.dataset.v;render();return;}
  if(a==='quick'){const v=+t.dataset.v;if(v===30){view.from=addDay(todayKey,-29);view.to=todayKey;}else{const d=dOf(todayKey),mon=addDay(todayKey,-((d.getDay()+6)%7));view.from=addDay(mon,v);view.to=v?addDay(mon,-1):todayKey;}render();return;}
  if(a==='ptgo'){sel={};selA={};toggleSel(id);selN=1;view.tab='in';view.day=todayKey;render();window.scrollTo(0,0);return;}
  if(a==='cday'){view.cday=t.dataset.k;render();return;}
  if(a==='offt'){const k=t.dataset.k,i=S.off.indexOf(k);if(i>=0)S.off.splice(i,1);else S.off.push(k);save();render();return;}
  if(a==='goin'){view.day=t.dataset.k;view.tab='in';render();window.scrollTo(0,0);return;}
  if(a==='send'||a==='copy'){const txt=reportText(t.dataset.k,t.dataset.f);
    if(a==='send'&&navigator.share){try{await navigator.share({text:txt});return;}catch(err){if(err&&err.name==='AbortError')return;}}
    toast(await copyText(txt)?'コピーしました。LINEなどに貼ってください':'コピーできませんでした');return;}
  // 設定
  if(a==='open'){view.open=view.open===id?null:id;render();return;}
  if(a==='loadfile'){fileMode='cfg';document.getElementById('fileIn').click();return;}
  if(a==='bkload'){fileMode='bk';document.getElementById('fileIn').click();return;}
  if(a==='bksave'){const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(blob);const el=document.createElement('a');el.href=u;el.download=`takami-backup-${todayKey}.json`;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return;}
  if(a==='oldapp'){let D=null;try{D=JSON.parse(localStorage.getItem('target_v1')||'null');}catch(err){}
    if(!D||!Array.isArray(D.items)||!D.items.length){try{const T=JSON.parse(localStorage.getItem('takami_v1')||'null');if(T&&Array.isArray(T.items)&&T.items.length)D=T;}catch(err){}}
    if(!D||!Array.isArray(D.items)||!D.items.length){alert('このスマホのこのブラウザでは、前のアプリの項目が見つかりませんでした。\n前のアプリの⚙で「設定の共有リンク」を作って、下の欄に貼ってください。');return;}
    if(!confirm(`前のアプリの項目を読み込みます。\n${D.items.map(x=>'・'+(x.name||'名前なし')).join('\n')}\n\nフェニックスの項目が置き換わります。`))return;
    const t={};for(const ym in (D.months||{})){if(ym>=curYM&&(D.months[ym]||{}).t)t[ym]=D.months[ym].t;}
    pxFromOld(D.items,D.ptCut,t);save();render();toast('読み込みました');return;}
  if(a==='cfglink'){const v=(document.getElementById('cfglink')||{}).value||'';const m=v.match(/[#&]cfg=([A-Za-z0-9_\-]+)/);if(!m){alert('「#cfg=」が入ったリンクを貼ってください');return;}
    let c;try{c=await decCode(m[1]);}catch(err){alert('読み込めませんでした。リンクが途中で切れているかもしれません。');return;}
    if(!c||c.kind!=='cfg'||!Array.isArray(c.items)){alert('目標達成マネージャーの設定リンクではありません');return;}
    if(!confirm(`前のアプリの項目を読み込みます。\n${c.items.map(x=>'・'+(x.name||'名前なし')).join('\n')}\n\nフェニックスの項目が置き換わります。`))return;
    pxFromOld(c.items,c.ptCut,c.t);save();render();toast('読み込みました');return;}
  if(a==='add'){const k=t.dataset.kind,nid=uid();
    if(k==='sb')S.sb.push({id:nid,name:'',kind:'cnt',den:'',hai:'',note:'',tiers:[],goal:{fixed:false,value:''}});
    else if(k==='px')S.px.push({id:nid,name:'',unit:'件',pt:'',mode:'cnt',subs:[],cut:{fixed:true,value:''},goal:{fixed:false,value:''}});
    else S.inp.push({id:nid,name:'',grp:'その他',cat:'',sb:[],px:[]});
    view.open=nid;save();render();return;}
  if(a==='mv'){const L=listOf(t.dataset.kind),i=L.findIndex(x=>x.id===id),j=i+(+t.dataset.v);if(i<0||j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render();return;}
  if(a==='del'){if(view.del!==id){view.del=id;render();return;}const k=t.dataset.kind;
    if(k==='sb'){S.sb=S.sb.filter(x=>x.id!==id);S.inp.forEach(x=>x.sb=x.sb.filter(l=>l.i!==id));S.sb.forEach(x=>{if(x.den===id)x.den='';});}
    else if(k==='px'){S.px=S.px.filter(x=>x.id!==id);S.inp.forEach(x=>x.px=x.px.filter(l=>l.i!==id));}
    else S.inp=S.inp.filter(x=>x.id!==id);
    view.del=null;save();render();return;}
  if(a==='tfix'){const it=findK(t.dataset.kind,id);if(!it)return;it[t.dataset.k].fixed=t.dataset.v==='1';save();render();return;}
  if(a==='tadd'){const it=sbById(id);if(it){it.tiers.push({id:uid(),p:'',pt:''});save();render();}return;}
  if(a==='tdel'){const it=sbById(id);if(it){it.tiers=it.tiers.filter(x=>x.id!==t.dataset.t);save();render();}return;}
  if(a==='sadd'){const it=pxById(id);if(it){it.subs.push({id:uid(),name:'',pt:it.subs.length?'':it.pt,cut:false});save();render();}return;}
  if(a==='sdel'){const it=pxById(id);if(it){const s=t.dataset.s;it.subs=it.subs.filter(x=>x.id!==s);S.inp.forEach(x=>x.px=x.px.filter(l=>!(l.i===id&&l.s===s)));save();render();}return;}
  if(a==='ladd'){const x=inpById(id);if(!x)return;x[t.dataset.kind].push({i:'',q:1});render();return;}
  if(a==='ldel'){const x=inpById(id);if(!x)return;x[t.dataset.kind].splice(+t.dataset.j,1);save();render();return;}
  if(a==='wipe'){if(view.del!=='wipe'){view.del='wipe';render();return;}if(!confirm('入力した実績・設定をすべて消します。元に戻せません。'))return;S=blank();save();view.del=null;render();return;}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='selN'){selN=+t.value;render();return;}
  const a=t.dataset.a;if(!a)return;const id=t.dataset.id;
  if(a==='pick'){if(t.value)toggleSel(t.value);render();return;}
  if(a==='yen'){selY[id]=t.value;return;}
  if(a==='from'||a==='to'){if(DAY_RE.test(t.value))view[a]=t.value;render();return;}
  if(a==='note'){const k=t.dataset.k,n=S.notes[k]=S.notes[k]||{memo:'',mgr:'',bu:''};n[t.dataset.f]=t.value.slice(0,3000);if(!n.memo&&!n.mgr&&!n.bu)delete S.notes[k];save();toast('保存しました');return;}
  if(a==='ptcut'){S.ptCut=numB(t.value);save();render();return;}
  if(a==='f'){const it=findK(t.dataset.kind,id);if(!it)return;const f=t.dataset.f;
    if(['hai','pt'].includes(f))it[f]=numB(t.value);else if(f==='kind')it.kind=t.value==='rate'?'rate':'cnt';else if(f==='mode')it.mode=t.value==='yen'?'yen':'cnt';else it[f]=t.value.slice(0,f==='note'?300:60);
    if(t.dataset.kind==='px'&&f==='grp'&&it.sbl){const z=inpById(it.sbl);if(!z||(z.grp||'その他')!==it.grp)it.sbl='';}
    save();render();return;}
  if(a==='tval'){const it=findK(t.dataset.kind,id);if(!it)return;setT(view.ym,it,t.dataset.k,numB(t.value));save();render();return;}
  if(a==='tier'){const it=sbById(id);const x=it&&it.tiers.find(v=>v.id===t.dataset.t);if(!x)return;x[t.dataset.f]=numB(t.value);save();render();return;}
  if(a==='sf'){const it=pxById(id);const s=it&&it.subs.find(v=>v.id===t.dataset.s);if(!s)return;if(t.dataset.f==='pt')s.pt=numB(t.value);else s.name=t.value.slice(0,60);save();render();return;}
  if(a==='lk'){const x=inpById(id);if(!x)return;const l=x[t.dataset.kind][+t.dataset.j];if(!l)return;
    if(t.dataset.kind==='sb')l.i=t.value;else{const[i,s]=t.value.split('|');l.i=i||'';if(s)l.s=s;else delete l.s;}
    if(!l.i)x[t.dataset.kind].splice(+t.dataset.j,1);save();render();return;}
  if(a==='lq'){const x=inpById(id);if(!x)return;const l=x[t.dataset.kind][+t.dataset.j];if(!l)return;l.q=numB(t.value)===''?1:num(t.value);save();render();return;}
});
render();
