<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#16a34a;--warn:#ea580c;--bad:#dc2626;--sb:#e60012;--px:#d97706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;padding-bottom:86px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 12px}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:38px}
.hrow>:first-child{justify-self:start}.hrow>:last-child{justify-self:end}
.hb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:38px;height:36px;font-size:18px}
.mg{display:flex;align-items:center;gap:8px}.mt{font-size:18px;font-weight:800;white-space:nowrap}
.org{height:32px;padding:0 10px;border:0;border-radius:16px;color:#fff;font-size:12.5px;font-weight:800;white-space:nowrap}
.gear{background:none;border:0;color:#fff;min-width:40px;height:36px;display:flex;align-items:center;justify-content:center}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ttl{font-weight:800;font-size:16px}.sub{color:var(--sub);font-size:13px}
.sect{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;margin:4px 2px 8px}.sect::before{content:'';width:5px;height:18px;border-radius:3px;background:var(--sc,var(--acc))}
.btn{display:block;width:100%;height:48px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:800;margin-top:10px}
.btn:disabled{background:#cbd5e1}.btn.ghost{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}.btn.red{background:#fff;color:var(--bad);border:1.5px solid #fecaca}
.mini{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--ink)}

.flex{display:flex;align-items:center;gap:8px}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.csec{margin:16px 0 0;padding:6px 10px;border-radius:9px;font-size:14px;font-weight:800;color:#fff}.csec.sb{background:var(--sb)}.csec.px{background:var(--px)}
.ctabs{display:flex;gap:6px;margin-top:10px}

.dayrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}.dayrow .dt{font-weight:800;font-size:17px;min-width:150px;text-align:center}

.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.kv div{background:#f8fafc;border-radius:10px;padding:7px 8px}.kv span{display:block;font-size:11.5px;color:var(--sub)}.kv b{font-size:15px}
.field{margin-top:10px}.field label{display:block;font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:4px}
.field input,.field select,.field textarea,.inp{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}
textarea.inp,.field textarea{height:auto;padding:8px 10px;line-height:1.5;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.empty{text-align:center;color:var(--sub);padding:18px 6px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6}
.lnk{display:flex;gap:6px;align-items:center;margin-top:6px}.lnk select{flex:3;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 6px;background:#fff;min-width:0}.lnk input{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 6px;min-width:0;width:56px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.cats button{height:44px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:13.5px;font-weight:800;color:var(--ink);padding:0 4px;line-height:1.2}
.cats button.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff}
.lvl{margin-top:12px}.lvl .lt{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
.chip.px{border-color:#fed7aa}.chip .f{color:var(--px)}.chip .s{color:var(--sb)}
.tree{font-size:14px;line-height:1.5}.tree .nd{padding:5px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.tree .nd:first-child{border-top:0}
.tree button.nd{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:14px;color:var(--ink)}

<body>
<header id="hd"></header>
<main id="app"></main>
<nav id="nv"></nav>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
'use strict';
// ===================== 基本 =====================
const LS='takami_v3',OLD_LS='takami_v2';
const WD='日月火水木金土';
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const NOW=new Date(),todayKey=dkey(NOW),curYM=todayKey.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n)||0;return (Math.round(n*10)/10).toLocaleString('ja-JP');};
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
const numB=v=>v===''||v==null||!Number.isFinite(Number(v))?'':Number(v);
const str=(v,m=60)=>String(v??'').slice(0,m);
const ID_RE=/^[A-Za-z0-9_-]{1,40}$/,DAY_RE=/^\d{4}-\d{2}-\d{2}$/,YM_RE=/^\d{4}-\d{2}$/;
const cid=v=>ID_RE.test(String(v??''))?String(v):uid();
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const dOf=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));
const addDay=(k,n)=>{const d=dOf(k);d.setDate(d.getDate()+n);return dkey(d);};
const dayLabel=k=>`${+k.slice(5,7)}月${+k.slice(8,10)}日（${WD[dOf(k).getDay()]}）`;
const ymLabel=ym=>`${ym.slice(0,4)}年${+ym.slice(5,7)}月`;
const norm=s=>String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();


// ===================== マインドマップ（ここを書き換えると入力が変わる） =====================
// 書き方：マインドマップの文字をそのまま、字下げ（スペース2つ）で階層にする。
//   (F 名前 ◯pt) … フェニックスの項目とポイント（名前がなければ、その行の名前）
//   (S 名前) / (S 名前 ◯pt) … ソフトバンクの項目（ポイントは分かったら書き足す）
//   「# 大分類 | 形 | g=…」 形：path＝順に選ぶ／multi＝複数選択／model＝機種名入力／one＝ボタン1つ／yen＝金額入力
//   g=cat … フェニックスの項目を大分類ごとにまとめる　g=1 … 大分類のすぐ下の名前ごとにまとめる
//   「=名前」で同じリストを定義して「@名前」で使い回す
const MAP_VER='2026-11-26';
const MAP_TEXT=`
# 回線 | path | g=cat | blue
SB
  新規
    端末あり
      @SBプラン
    SIM
      @SBプラン
  MNP
    端末あり(F 他社MNP 10pt)
      @SBプラン
    SIM(F 他社MNP 6pt)
      @SBプラン
  機種変更
    端末あり(F 機種変更 2pt)
      @SBプラン
    持ち込み
      @SBプラン
  番号移行
    端末あり(F 機種変更(up) 2pt)
      @SBプラン
    SIM
      @SBプラン
YM
  新規
    端末あり
      @YMプラン
    SIM
      @YMプラン
  MNP
    端末あり(F 他社MNP 6pt)
      @YMプラン
    SIM(F 他社MNP 4pt)
      @YMプラン
  機種変更
    端末あり(F 機種変更 2pt)
      @YMプラン
    持ち込み
      @YMプラン
  番号移行
    端末あり
      @YMプラン
    SIM
      @YMプラン
=SBプラン
ペイトク(S 大容量)
テイガク(S 大容量)
ミニフィット(S その他)
デビュー(S その他)
=YMプラン
S(S その他)
M(S 大容量)
L(S 大容量)
# オプション | multi | g=1
通話オプション
あんしん保証パック
セキュリティパック
店頭スマホサポート
  フルプラン(F フルプラン 5pt)
  ライトプラン(F ライトプラン 2pt)
  単品
PayPayカード
  ノーマル(F ノーマル 5pt)
  2枚目(F 追加 5pt)
  ゴールド(F ゴールド 12pt)
YTPL(F YTPL 1pt)
# 固定・電気・他 | path | g=1
SB光
  新規(F 新規 12pt)
  air新規(F 新規 12pt)
  air機変(F air機変 8pt)
  光転用(F 転用 8pt)
でんき
  でんき(F でんき 5pt)
  でんわ(F でんわ 4pt)
iPad/タブレット
  新規(F 新規 10pt)
  機変(F 機種変更 5pt)
watch
  aw(F watch 4pt)
  pw(F watch 4pt)
  gw(F watch 4pt)
# 端末 | model | g=cat
pixel10a 128(F 3pt)
pixel10a 256(F 5pt)
pixel11(F 6pt)
# SBswipe(F IP+pixel 5pt) | one | g=cat
# アクセサリー | yen | g=cat
`;

// ---------- マインドマップを読む ----------
function splitTags(s){ // 「名前(F …)(S …)」→ 名前とカッコの中身（カッコの入れ子OK）
  let name='',tags=[],dep=0,cur='';
  for(const ch of s){
    if(ch==='('||ch==='（'){if(dep>0)cur+='(';dep++;continue;}
    if((ch===')'||ch==='）')&&dep>0){dep--;if(dep===0){tags.push(cur.trim());cur='';}else cur+=')';continue;}
    if(dep>0)cur+=ch;else name+=ch;}
  return{name:name.trim(),tags};
}
function parseTags(nd,tags){
  for(const t of tags){
    let m=t.match(/^F\s*(.*?)\s*([\d.]+)\s*pt$/i);
    if(m){nd.F={name:m[1].trim()||nd.n,pt:Number(m[2])};continue;}
    m=t.match(/^S\s*(.*?)(?:\s+([\d.]+)\s*pt)?$/i);
    if(m&&m[1].trim()){nd.S={name:m[1].trim(),pt:m[2]!=null?Number(m[2]):null};}
  }
}
function parseMap(text){
  const cats=[],macros={};let target=null,stack=[];
  for(const raw of text.split('\n')){
    if(!raw.trim())continue;
    if(raw.startsWith('#')){
      const parts=raw.slice(1).split('|').map(x=>x.trim());
      const{name,tags}=splitTags(parts[0]);
      const c={n:name,type:parts[1]||'path',g:'1',color:'red',c:[]};
      parts.slice(2).forEach(p=>{if(p.startsWith('g='))c.g=p.slice(2);else if(p)c.color=p;});
      parseTags(c,tags);cats.push(c);target=c;stack=[{d:-1,nd:c}];continue;}
    if(raw.startsWith('=')){const m={n:raw.slice(1).trim(),c:[]};macros[m.n]=m;target=m;stack=[{d:-1,nd:m}];continue;}
    if(!target)continue;
    const d=Math.floor((raw.match(/^ */)[0].length)/2),line=raw.trim();
    while(stack.length>1&&stack[stack.length-1].d>=d)stack.pop();
    const parent=stack[stack.length-1].nd;
    let nd;
    if(line.startsWith('@'))nd={macro:line.slice(1).trim()};
    else{const{name,tags}=splitTags(line);nd={n:name,c:[]};parseTags(nd,tags);}
    parent.c.push(nd);stack.push({d,nd});
  }
  const expand=list=>{const out=[];for(const nd of list){if(nd.macro){const m=macros[nd.macro];if(m)out.push(...expand(m.c));}else{nd.c=expand(nd.c||[]);out.push(nd);}}return out;};
  cats.forEach(c=>{c.c=expand(c.c);});
  return cats;
}
const MAP=parseMap(MAP_TEXT);
const catBy=n=>MAP.find(c=>c.n===n);
// フェニックスの項目の「まとめ名」
function fGroup(cat,path){if(cat.g==='cat'||!path.length)return cat.n;return path[0].n;}
const fKey=(g,name)=>g+'｜'+name;
const fLabel=k=>{const[g,n]=String(k).split('｜');return n===undefined?g:g===n?n:g+'・'+n;};
// 一覧（実績確認・設定で並べる順）
const F_LIST=[],S_LIST=[],S_PT={};
(function walk(){
  const addF=k=>{if(!F_LIST.includes(k))F_LIST.push(k);};
  MAP.forEach(cat=>{
    if(cat.F)addF(fKey(fGroup(cat,[]),cat.F.name));
    const rec=(nd,path)=>{nd.c.forEach(ch=>{const p=path.concat(ch);if(ch.F)addF(fKey(fGroup(cat,p),ch.F.name));if(ch.S){if(!S_LIST.includes(ch.S.name))S_LIST.push(ch.S.name);if(ch.S.pt!=null)S_PT[ch.S.name]=ch.S.pt;}rec(ch,p);});};
    rec(cat,[]);});
})();
const ACC_KEY='アクセサリー（金額）';

// ===================== データ =====================
const BAD_K=k=>k==='__proto__'||k==='constructor'||k==='prototype';
function blank(){return{v:3,ptCut:'',cfg:{},months:{},logs:{},notes:{},off:[]};}
function sanitize(D){
  if(!D||typeof D!=='object'||Array.isArray(D))D={};
  const o=blank(),A=a=>Array.isArray(a)?a:[];
  const tg=g=>({fixed:!!(g&&g.fixed),value:numB(g&&g.value)});
  o.ptCut=numB(D.ptCut);
  const C=D.cfg&&typeof D.cfg==='object'?D.cfg:{};
  for(const k in C){if(BAD_K(k)||k.length>80)continue;const v=C[k]||{};o.cfg[k]={cut:tg(v.cut),goal:tg(v.goal)};}
  const M=D.months&&typeof D.months==='object'?D.months:{};
  for(const ym in M){if(!YM_RE.test(ym))continue;const t=(M[ym]||{}).t||{},ot={};for(const i in t){if(BAD_K(i)||i.length>80)continue;const v=t[i]||{},r={};if('cut' in v)r.cut=numB(v.cut);if('goal' in v)r.goal=numB(v.goal);ot[i]=r;}o.months[ym]={t:ot};}
  const L=D.logs&&typeof D.logs==='object'?D.logs:{};
  for(const k in L){if(!DAY_RE.test(k)||!Array.isArray(L[k]))continue;
    const a=L[k].filter(r=>r&&typeof r==='object').slice(0,300).map(r=>({id:cid(r.id),ts:num(r.ts),n:Math.max(1,Math.min(99,Math.round(num(r.n)||1))),cat:str(r.cat,40),label:str(r.label,300),
      f:A(r.f).filter(x=>Array.isArray(x)&&!BAD_K(String(x[0]))).slice(0,30).map(x=>[str(x[0],80),num(x[1])]),
      s:A(r.s).map(x=>str(x,40)).filter(x=>x&&!BAD_K(x)).slice(0,30),yen:Math.max(0,num(r.yen))})).filter(r=>r.cat);
    if(a.length)o.logs[k]=a;}
  const N=D.notes&&typeof D.notes==='object'?D.notes:{};

function agg(from,to){
  const r={f:{},fpt:{},s:{},pts:0,spts:0,yen:0,recs:0,cats:{}};
  for(const k in S.logs){if(k<from||k>to)continue;for(const rec of S.logs[k]){r.recs++;r.cats[rec.cat]=(r.cats[rec.cat]||0)+rec.n;

function draft(){
  const cat=catBy(IN.cat);if(!cat)return null;
  const f=[],s=[],names=[];let ok=false,yen=0;
  const take=(nd,path)=>{if(nd.F)f.push([fKey(fGroup(cat,path),nd.F.name),nd.F.pt]);if(nd.S)s.push(nd.S.name);};
  if(cat.F||cat.S)take(cat,[]);
  if(cat.type==='path'){let list=cat.c,path=[];
    for(const i of IN.path){const nd=list[i];if(!nd)break;path.push(nd);take(nd,path);names.push(nd.n);list=nd.c;}
    ok=path.length>0&&path[path.length-1].c.length===0;}
  else if(cat.type==='multi'){cat.c.forEach((nd,i)=>{if(!(i in IN.multi))return;const j=IN.multi[i];
      if(nd.c.length){const ch=nd.c[j];if(!ch)return;take(nd,[nd]);take(ch,[nd,ch]);names.push(nd.n+'（'+ch.n+'）');}
      else{take(nd,[nd]);names.push(nd.n);}});
    ok=names.length>0;}
  else if(cat.type==='model'){const m=IN.model.trim();if(m){const nd=cat.c.find(x=>norm(x.n)===norm(m));if(nd){take(nd,[nd]);names.push(nd.n);}else names.push(m.slice(0,60));ok=true;}}
  else if(cat.type==='yen'){yen=Math.max(0,num(IN.yen));ok=yen>0;if(ok)names.push(fmt(yen)+'円');}
  else ok=true;
  return{cat,f,s,yen,ok,label:names.join('／')};
}

    const line=(nd,dep,path)=>{const ok=keep(nd);if(!ok)return '';const leaf=!nd.c.some(keep);
      const tag=px?(nd.F?`<b style="color:var(--px);white-space:nowrap">${fmt(nd.F.pt)}pt</b>`:''):(nd.S?`<span class="tag sb">${esc(nd.S.name)}${nd.S.pt!=null?' '+fmt(nd.S.pt)+'pt':''}</span>`:'');
      const inner=`<span style="padding-left:${dep*14}px">${dep?'└ ':''}${esc(nd.n)}${px&&nd.F&&nd.F.name!==nd.n?`<span class="sub">（${esc(nd.F.name)}）</span>`:''}</span>${tag}`;
      const self=(cat.type==='path'||cat.type==='multi'||cat.type==='model')?`<button class="nd" data-a="ptgo" data-c="${ci}" data-p="${path.join(',')}">${inner}</button>`:`<div class="nd">${inner}</div>`;
      return self+(leaf?'':nd.c.map((ch,i)=>line(ch,dep+1,path.concat(i))).join(''));};
    const top=cat.F?`<div class="nd"><span>${esc(cat.n)}</span>${px?`<b style="color:var(--px)">${fmt(cat.F.pt)}pt</b>`:''}</div>`:'';
    return `<div class="card"><div class="ttl" style="margin-bottom:4px">${esc(cat.n)}</div><div class="tree">${top}${cat.c.map((nd,i)=>line(nd,0,[i])).join('')}</div></div>`;}).join('');
  h+=`<div class="sub" style="text-align:center">タップすると入力タブでその内容を選んだ状態になります</div>`;
  return h;
}

// ---------- タブ4：カレンダー・報告 ----------
function calView(){
  const ym=view.ym,n=daysIn(ym),first=dOf(ym+'-01').getDay();
  let g='';for(let i=0;i<first;i++)g+='<span></span>';
  for(let d=1;d<=n;d++){const k=ym+'-'+pad(d),L=S.logs[k]||[],p=L.reduce((a,r)=>a+recPt(r),0),off=S.off.includes(k),nt=S.notes[k];
    g+=`<button data-a="cday" data-k="${k}" class="${off?'off':''} ${k===todayKey?'tdy':''} ${k===view.cday?'sel':''}"><b>${d}</b>${off?'<small style="color:inherit">休</small>':p?`<small>${fmt(p)}pt</small>`:L.length?`<small>${L.length}件</small>`:''}${nt&&(nt.memo||nt.mgr||nt.bu)?'<i>●</i>':''}</button>`;}
  const k=view.cday&&view.cday.slice(0,7)===ym?view.cday:null;
  let h=`<div class="card"><div class="cal">${[...WD].map((w,i)=>`<div class="w" style="${i===0?'color:var(--bad)':i===6?'color:var(--acc)':''}">${w}</div>`).join('')}${g}</div>
    <div class="sub" style="margin-top:8px">数字＝フェニックスのポイント、赤い●＝メモや報告あり</div></div>`;
  if(!k)return h+`<div class="card sub">日付をタップすると、その日のメモと報告が書けます。</div>`;
  const L=S.logs[k]||[],A=agg(k,k),nt=S.notes[k]||{},off=S.off.includes(k);
  h+=`<div class="card"><div class="between"><div class="ttl">${dayLabel(k)}</div><button class="mini ${off?'on':''}" data-a="offt" data-k="${k}">${off?'休みを外す':'休みにする'}</button></div>
    <div class="sub" style="margin-top:4px">入力 ${L.length}件・フェニックス <b style="color:var(--px)">${fmt(A.pts)}pt</b></div>
    <div style="margin-top:4px">${Object.keys(A.s).map(x=>`<span class="tag sb">${esc(x)} ${fmt(A.s[x])}</span>`).join('')}</div>
    <button class="mini" data-a="goin" data-k="${k}" style="margin-top:8px">この日の入力を開く</button>
    <div class="field"><label>フリー入力欄（自分用メモ）</label><textarea rows="3" data-a="note" data-f="memo" data-k="${k}" placeholder="気づいたこと、明日やることなど">${esc(nt.memo)}</textarea></div>
    <div class="field"><label>店長に報告</label><textarea rows="3" data-a="note" data-f="mgr" data-k="${k}" placeholder="店長への報告">${esc(nt.mgr)}</textarea>
      <div class="flex" style="margin-top:6px"><button class="mini" data-a="send" data-f="mgr" data-k="${k}" style="flex:1;background:var(--acc);color:#fff;border:0;font-weight:700">店長に送る</button><button class="mini" data-a="copy" data-f="mgr" data-k="${k}">コピー</button></div></div>
    <div class="field"><label>部長に報告</label><textarea rows="3" data-a="note" data-f="bu" data-k="${k}" placeholder="部長への報告">${esc(nt.bu)}</textarea>
      <div class="flex" style="margin-top:6px"><button class="mini" data-a="send" data-f="bu" data-k="${k}" style="flex:1;background:var(--acc);color:#fff;border:0;font-weight:700">部長に送る</button><button class="mini" data-a="copy" data-f="bu" data-k="${k}">コピー</button></div></div>
    <div class="sub" style="margin-top:6px">「送る」を押すと、その日の実績を付けた文章を LINE などで送れます。</div></div>`;
  return h;
}
function reportText(k,f){
  const A=agg(k,k),nt=S.notes[k]||{},ym=k.slice(0,7),M=agg(ym+'-01',k);
  const cats=Object.keys(A.cats).map(c=>`${c} ${fmt(A.cats[c])}`).join('、')||'なし';
  const sb=Object.keys(A.s).map(x=>`${x} ${fmt(A.s[x])}`).join('、')||'なし';
  return `【${dayLabel(k)}の報告】\n■獲得：${cats}\n■ソフトバンク：${sb}\n■フェニックス：${fmt(A.pts)}pt（${+ym.slice(5)}月の累計 ${fmt(M.pts)}pt）${A.yen?`\n■アクセサリー：${fmt(A.yen)}円`:''}\n\n${nt[f]||''}`.trim();
}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e2){}ta.remove();return ok;}}

// ---------- ⚙ 設定 ----------
function tgtField(k,w,label,ym,unit){const g=cfgOf(k)[w],v=tval(ym,k,w),mo=+ym.slice(5);
  return `<div class="field"><label>${label}　<span class="seg" style="display:inline-flex;margin:0;vertical-align:middle;padding:2px"><button style="height:26px;padding:0 8px;font-size:12px" class="${g.fixed?'on':''}" data-a="tfix" data-id="${esc(k)}" data-k="${w}" data-v="1">毎月同じ</button><button style="height:26px;padding:0 8px;font-size:12px" class="${g.fixed?'':'on'}" data-a="tfix" data-id="${esc(k)}" data-k="${w}" data-v="0">月ごと</button></span></label>
    <div class="flex"><input class="inp" type="number" inputmode="decimal" value="${v??''}" data-a="tval" data-id="${esc(k)}" data-k="${w}" placeholder="${g.fixed?'なしなら空欄':mo+'月の値'}"><span class="sub" style="white-space:nowrap">${unit}・${g.fixed?'全月':mo+'月分'}</span></div></div>`;}
function tgtRow(k,label,ym,unit){const o=view.open===k,c=num(tval(ym,k,'cut')),g=num(tval(ym,k,'goal'));
  return `<button class="ihead" data-a="open" data-id="${esc(k)}"><span><b>${esc(label)}</b><span class="sub">${c?'　足切り'+fmt(c):''}${g?'　目標'+fmt(g):''}</span></span><span class="chev">${o?'閉じる ▲':'設定 ▼'}</span></button>`+
    (o?`<div class="ibody">${tgtField(k,'cut','足切り',ym,unit)}${tgtField(k,'goal','目標',ym,unit)}</div>`:'');}
function setView(){
  const ym=view.ym;
  let h=`<div class="card"><div class="ttl">目標の設定</div><div class="sub">${ymLabel(ym)}の値を表示しています（月は実績確認・カレンダーの‹ ›で切り替え）</div></div>`;
  h+=`<div class="card"><div class="ttl" style="color:var(--px)">フェニックス</div>
    <div class="field"><label>ポイントの足切り（月）</label><div class="flex"><input class="inp" type="number" inputmode="decimal" value="${S.ptCut??''}" data-a="ptcut" placeholder="なしなら空欄"><span class="sub">pt</span></div></div>
    <div style="margin-top:8px">${F_LIST.map(k=>tgtRow(k,fLabel(k),ym,'件')).join('')}${tgtRow(ACC_KEY,'アクセサリー（金額）',ym,'円')}</div></div>`;
  h+=`<div class="card"><div class="ttl" style="color:var(--sb)">ソフトバンク</div><div style="margin-top:8px">${S_LIST.map(k=>tgtRow('S｜'+k,k,ym,'件')).join('')}</div></div>`;
  h+=`<div class="card"><div class="ttl">入力の項目について</div><div class="sub" style="line-height:1.7">入力の項目とポイントはマインドマップ（${MAP_VER}版）から作っています。マインドマップに書き足したら、Claudeに送ってください。アプリに反映します。</div></div>`;
  let old=false;try{old=!!localStorage.getItem(OLD_LS);}catch(e){}
  h+=`<div class="card"><div class="ttl">バックアップ</div><div class="sub">データはこのスマホの中だけに保存されています。ときどきファイルに保存してください。</div>
    <button class="btn ghost" data-a="bksave">ファイルに保存</button><button class="btn ghost" data-a="bkload">バックアップから戻す</button>
    ${old?'<button class="btn ghost" data-a="oldsave">前の形のデータ（11月まで）をファイルに保存</button>':''}
    <button class="btn red" data-a="wipe">${view.del==='wipe'?'本当に全部消す':'全部消す'}</button></div>`;
  return h;
}

// ===================== 操作 =====================
function dl(obj,name){const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});const u=URL.createObjectURL(blob);const el=document.createElement('a');el.href=u;el.download=name;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
document.getElementById('fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>3e6){alert('ファイルが大きすぎます');return;}
  let c;try{c=JSON.parse(await f.text());}catch(err){alert('読み込めませんでした。ファイルが壊れているかもしれません。');return;}
  if(!c||c.v!==3){alert('takami（新しい形）のバックアップファイルではありません');return;}
  if(!confirm('今のデータを、このバックアップの内容に置き換えます。よろしいですか？'))return;S=sanitize(c);save();render();toast('バックアップから戻しました');
});
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb){view.tab=tb.dataset.tab;view.del=null;render();window.scrollTo(0,0);return;}
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,id=t.dataset.id;
  if(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')return;
  if(a!=='rdel'&&a!=='wipe')view.del=null;
  if(a==='gear'){view.tab='set';view.open=null;render();window.scrollTo(0,0);return;}
  if(a==='back'){view.tab='in';render();return;}
  if(a==='org'){view.org=view.org==='px'?'sb':'px';render();return;}
  if(a==='mprev'||a==='mnext'){const d=new Date(+view.ym.slice(0,4),+view.ym.slice(5,7)-1+(a==='mnext'?1:-1),1);view.ym=d.getFullYear()+'-'+pad(d.getMonth()+1);render();return;}
  if(a==='dprev'||a==='dnext'){view.day=addDay(view.day,a==='dnext'?1:-1);view.ym=view.day.slice(0,7);render();return;}
  if(a==='dtoday'){view.day=todayKey;view.ym=curYM;render();return;}
  if(a==='cat'){if(catBy(t.dataset.v)){IN.cat=t.dataset.v;resetIn();}render();return;}
  if(a==='step'){const l=+t.dataset.l,i=+t.dataset.i;if(IN.path[l]===i)IN.path=IN.path.slice(0,l);else{IN.path=IN.path.slice(0,l);IN.path[l]=i;}render();return;}
  if(a==='mtog'){const i=+t.dataset.i;if(i in IN.multi)delete IN.multi[i];else IN.multi[i]=-1;render();return;}
  if(a==='msub'){const i=+t.dataset.i,j=+t.dataset.j;if(IN.multi[i]===j)delete IN.multi[i];else IN.multi[i]=j;render();return;}
  if(a==='mpick'){IN.model=norm(IN.model)===norm(t.dataset.v)?'':t.dataset.v;render();return;}
  if(a==='clr'){resetIn();render();return;}
  if(a==='reg'){const D=draft();if(!D||!D.ok)return;
    (S.logs[view.day]=S.logs[view.day]||[]).push({id:uid(),ts:Date.now(),n:IN.n,cat:D.cat.n,label:D.label,f:D.f,s:D.s,yen:D.yen});
    save();resetIn();render();toast('登録しました');return;}
  if(a==='rdel'){if(view.del!==id){view.del=id;render();return;}const L=S.logs[view.day]||[];const i=L.findIndex(r=>r.id===id);if(i>=0)L.splice(i,1);if(!L.length)delete S.logs[view.day];view.del=null;save();render();return;}
  if(a==='rng'){view.range=t.dataset.v;render();return;}
  if(a==='quick'){const v=+t.dataset.v;if(v===30){view.from=addDay(todayKey,-29);view.to=todayKey;}else{const d=dOf(todayKey),mon=addDay(todayKey,-((d.getDay()+6)%7));view.from=addDay(mon,v);view.to=v?addDay(mon,-1):todayKey;}render();return;}
  if(a==='ptgo'){const cat=MAP[+t.dataset.c];if(!cat)return;const p=String(t.dataset.p).split(',').filter(x=>x!=='').map(Number);
    IN.cat=cat.n;resetIn();
    if(cat.type==='path')IN.path=p;
    else if(cat.type==='multi'){if(p.length===1&&!cat.c[p[0]].c.length)IN.multi[p[0]]=-1;else if(p.length===2)IN.multi[p[0]]=p[1];}
    else if(cat.type==='model'&&cat.c[p[0]])IN.model=cat.c[p[0]].n;
    view.tab='in';view.day=todayKey;render();window.scrollTo(0,0);return;}
  if(a==='cday'){view.cday=t.dataset.k;render();return;}
  if(a==='offt'){const k=t.dataset.k,i=S.off.indexOf(k);if(i>=0)S.off.splice(i,1);else S.off.push(k);save();render();return;}
  if(a==='goin'){view.day=t.dataset.k;view.tab='in';render();window.scrollTo(0,0);return;}
  if(a==='send'||a==='copy'){const txt=reportText(t.dataset.k,t.dataset.f);
    if(a==='send'&&navigator.share){try{await navigator.share({text:txt});return;}catch(err){if(err&&err.name==='AbortError')return;}}
    toast(await copyText(txt)?'コピーしました。LINEなどに貼ってください':'コピーできませんでした');return;}
  if(a==='open'){view.open=view.open===id?null:id;render();return;}
  if(a==='tfix'){if(BAD_K(id))return;cfgOf(id)[t.dataset.k].fixed=t.dataset.v==='1';save();render();return;}
  if(a==='bkload'){document.getElementById('fileIn').click();return;}
  if(a==='bksave'){dl(S,`takami-backup-${todayKey}.json`);return;}
  if(a==='oldsave'){let raw=null;try{raw=JSON.parse(localStorage.getItem(OLD_LS)||'null');}catch(err){}if(!raw){toast('前のデータが見つかりませんでした');return;}dl(raw,`takami-old-${todayKey}.json`);return;}
  if(a==='wipe'){if(view.del!=='wipe'){view.del='wipe';render();return;}if(!confirm('入力した実績・設定をすべて消します。元に戻せません。'))return;S=blank();save();view.del=null;render();return;}
});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.a;if(a!=='model'&&a!=='yen')return;
  if(a==='model')IN.model=t.value.slice(0,60);else IN.yen=t.value;
  const b=document.getElementById('prevbox');if(b)b.innerHTML=prevHTML(draft(),catBy(IN.cat));
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.id==='selN'){IN.n=+t.value;render();return;}
  const a=t.dataset.a;if(!a)return;const id=t.dataset.id;
  if(a==='from'||a==='to'){if(DAY_RE.test(t.value))view[a]=t.value;render();return;}
  if(a==='note'){const k=t.dataset.k,n=S.notes[k]=S.notes[k]||{memo:'',mgr:'',bu:''};n[t.dataset.f]=t.value.slice(0,3000);if(!n.memo&&!n.mgr&&!n.bu)delete S.notes[k];save();toast('保存しました');return;}
  if(a==='ptcut'){S.ptCut=numB(t.value);save();render();return;}
  if(a==='tval'){if(BAD_K(id))return;setT(view.ym,id,t.dataset.k,numB(t.value));save();render();return;}
});
render();
</script>
</body>
