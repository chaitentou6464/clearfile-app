<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貯金アプリ</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon-v1.png">
<meta name="theme-color" content="#2f6fde">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="貯金アプリ">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2430;--sub:#6b7585;--line:#e3e7ec;--in:#1f9d6b;--out:#d9534f;--main:#2f6fde}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--main);color:#fff;padding:14px 16px 12px}
header h1{margin:0;font-size:18px}
.sum{display:flex;gap:8px;margin-top:10px}
.sum div{flex:1;background:rgba(255,255,255,.16);border-radius:10px;padding:8px}
.sum small{display:block;font-size:11px;opacity:.85}
.sum b{font-size:18px}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffd84d;width:0}
.goalTxt{font-size:12px;margin-top:4px;opacity:.9}
main{padding:12px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.head input[type=month]{font-size:17px;font-weight:700;border:none;background:none;color:var(--ink);padding:0}
.head .del{margin-left:auto}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.row label{flex:1;font-size:15px}
.row input{width:46%;text-align:right;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px}
.row.inc label{color:var(--in);font-weight:700}
.sec{font-size:12px;color:var(--sub);margin:8px 0 2px}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px;border-radius:10px;background:#f0f4fb;font-weight:700}
.total .v{font-size:20px}
.plus{color:var(--in)}.minus{color:var(--out)}
button{font-family:inherit;font-size:14px;border:none;border-radius:8px;padding:8px 12px;background:#e9eef6;color:var(--main);font-weight:700}
.del{background:none;color:var(--sub);font-size:13px;padding:4px 6px}
.addcol{width:100%;margin-top:6px;background:#fff;border:1.5px dashed #b9c6db}
.fab{position:fixed;left:12px;right:12px;bottom:14px;padding:14px;font-size:16px;background:var(--main);color:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(47,111,222,.35)}
.shareBtn{position:absolute;right:92px;top:10px;background:rgba(255,255,255,.18);color:#fff}
.gear{position:absolute;right:12px;top:10px;background:rgba(255,255,255,.18);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.sheet h2{font-size:17px;margin:0 0 10px}
.sheet .row input{width:55%;text-align:left}
#mConf{z-index:30}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;background:rgba(255,255,255,.16);color:#fff;padding:9px}
.tabs button.on{background:#fff;color:var(--main)}
.tblwrap{overflow-x:auto;background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table{border-collapse:collapse;min-width:100%;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f0f4fb;font-size:12px;color:var(--sub);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:700}
th:first-child{background:#f0f4fb}
td.inc{color:var(--in)}td.os{color:var(--out)}
tr.sumrow td{background:#fff8dc;font-weight:700}
tr.sumrow td:first-child{background:#fff8dc}
.note{font-size:12px;color:var(--sub);margin:8px 2px}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
#tbl td{padding:6px 4px}
.ti{width:96px;text-align:right;font-size:16px;padding:7px 6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;color:var(--ink);background:#fff}
.ti.inc{color:var(--in);font-weight:700}
.thi{width:96px;font-size:14px;font-weight:700;text-align:right;border:1px dashed #b9c6db;border-radius:6px;padding:6px;background:#fff;color:var(--ink);font-family:inherit}
.thi.inc{color:var(--in)}.thi.new{color:var(--main);text-align:center;font-weight:400}
.thc{display:flex;align-items:center;gap:2px;justify-content:flex-end}
.x{background:none;color:var(--sub);padding:4px;font-size:12px}
.tm{font-size:15px;font-weight:700;border:none;background:none;color:var(--ink);font-family:inherit;padding:0;width:112px}
</style>
</head>
<body>
<header>
  <h1>貯金アプリ</h1>
  <button class="shareBtn" onclick="openShare()">🔗 共有</button>
  <button class="gear" onclick="openSet()">⚙ 設定</button>
  <div class="sum">
    <div><small>貯金の合計</small><b id="sAll">0円</b></div>
    <div><small>月の平均</small><b id="sAvg">0円</b></div>
  </div>
  <div class="bar"><i id="gBar"></i></div>
  <div class="goalTxt" id="gTxt"></div>
  <div class="tabs"><button id="tb0" class="on" onclick="tab(0)">入力</button><button id="tb1" onclick="tab(1)">表</button></div>
</header>
<main id="list"></main>
<main id="tbl" style="display:none"></main>
<button class="fab" id="fab" onclick="addMonth()">＋ 次の月を追加</button>

<div class="modal" id="mSet" onclick="if(event.target===this)closeSet()">
  <div class="sheet">
    <h2>設定</h2>
    <div class="sec">貯金の目標額</div>
    <div class="row"><label>目標</label><input id="goal" inputmode="numeric" placeholder="例 1000000"></div>
    <div class="sec">支出の欄（全部の月に共通）</div>
    <div id="cols"></div>
    <div class="row"><input id="newCol" placeholder="例：保険、交際費"><button onclick="addCol()">＋追加</button></div>
    <div style="height:12px"></div>
    <button style="width:100%" onclick="closeSet()">閉じる</button>
  </div>
</div>

<div class="modal" id="mShare" onclick="if(event.target===this)closeShare()">
  <div class="sheet">
    <h2>ほかの端末と共有</h2>
    <div class="note" style="margin:0 0 10px">今のデータ（全部の月・項目・目標）をURLにします。ほかの端末でこのURLを開くと、同じデータを読み込めます。<br>※URLを作った時点のデータです。あとで変えたら、もう一度URLを作って送ってください。<br>※URLを知っている人は中身を見られるので、送る相手に気をつけてください。</div>
    <textarea id="shareUrl" readonly style="width:100%;height:90px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button style="flex:1" onclick="copyShare()" id="copyBtn">コピー</button>
      <button style="flex:1;background:var(--main);color:#fff" onclick="sendShare()" id="sendBtn">送る（LINEなど）</button>
    </div>
    <div style="height:10px"></div>
    <button style="width:100%" onclick="closeShare()">閉じる</button>
  </div>
</div>

<div class="modal" id="mConf" onclick="if(event.target===this)confNo()">
  <div class="sheet"><h2 id="confMsg"></h2>
  <div style="display:flex;gap:8px"><button style="flex:1" onclick="confNo()">やめる</button><button style="flex:1;background:var(--out);color:#fff" onclick="confYes()" id="confOk">削除する</button></div></div>
</div>
<script>
let confCb=null;
function ask(msg,cb,ok){confCb=cb;const b=document.getElementById('confOk');b.textContent=ok||'削除する';b.style.background=ok?'var(--main)':'var(--out)';document.getElementById('confMsg').textContent=msg;document.getElementById('mConf').classList.add('on')}
function confNo(){confCb=null;document.getElementById('mConf').classList.remove('on')}
function confYes(){const c=confCb;confNo();if(c)c()}
const KEY='chokin-app-v1';
let D={goal:0,cols:['家賃','食費','光熱費','スマホ代'],months:[]};
try{const s=localStorage.getItem(KEY);if(s)D=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const yen=n=>(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('ja-JP')+'円';
const num=v=>{const n=Number(String(v).replace(/[^\d.-]/g,''));return isNaN(n)?0:n};
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function outSum(m){return D.cols.reduce((a,_,i)=>a+num(m.out[i]||0),0)}
function tot(m){return num(m.inc)-outSum(m)}

function addMonth(){
  let d=new Date();
  if(D.months.length){const [y,mo]=D.months[0].ym.split('-').map(Number);d=new Date(y,mo,1)}
  D.months.unshift({ym:ym(d),inc:'',out:[]});save();render();
}
function delMonth(i){ask(D.months[i].ym.replace('-','年')+'月を消しますか？',()=>{D.months.splice(i,1);save();render()})}
function setVal(i,k,j,el){
  const m=D.months[i];
  if(k==='inc')m.inc=el.value;else m.out[j]=el.value;
  save();
  document.getElementById('t'+i).innerHTML=fmtTot(m);
  document.getElementById('o'+i).textContent=yen(outSum(m));
  summary();
}
function fmtTot(m){const t=tot(m);return '<span class="v '+(t<0?'minus':'plus')+'">'+yen(t)+'</span>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  if(curTab===1)renderTbl();
  const L=document.getElementById('list');
  if(!D.months.length){L.innerHTML='<div class="empty">下の「＋ 次の月を追加」から<br>月を追加してください</div>';summary();return}
  L.innerHTML=D.months.map((m,i)=>`
  <div class="card">
    <div class="head">
      <input type="month" value="${m.ym}" onchange="D.months[${i}].ym=this.value;save()">
      <button class="del" onclick="delMonth(${i})">🗑 削除</button>
    </div>
    <div class="row inc"><label>${esc(D.incLabel||'収入')}</label><input inputmode="numeric" value="${esc(m.inc)}" placeholder="0" oninput="setVal(${i},'inc',0,this)"></div>
    <div class="sec">支出（合計 <span id="o${i}">${yen(outSum(m))}</span>）</div>
    ${D.cols.map((c,j)=>`<div class="row"><label>${esc(c)}</label><input inputmode="numeric" value="${esc(m.out[j]||'')}" placeholder="0" oninput="setVal(${i},'out',${j},this)"></div>`).join('')}
    <button class="addcol" onclick="openSet(true)">＋ 支出の欄を追加</button>
    <div class="total"><span>合計（収入−支出）</span><span id="t${i}">${fmtTot(m)}</span></div>
  </div>`).join('');
  summary();
}
function summary(){
  const all=D.months.reduce((a,m)=>a+tot(m),0);
  document.getElementById('sAll').textContent=yen(all);
  document.getElementById('sAvg').textContent=yen(D.months.length?all/D.months.length:0);
  const g=num(D.goal),bar=document.getElementById('gBar'),t=document.getElementById('gTxt');
  if(g>0){const p=Math.max(0,Math.min(100,all/g*100));bar.style.width=p+'%';
    const rest=g-all;t.textContent='目標 '+yen(g)+' ／ 達成 '+p.toFixed(1)+'%'+(rest>0?' ／ あと '+yen(rest):' 🎉 達成！');}
  else{bar.style.width='0';t.textContent='⚙ 設定から目標額を入れられます'}
}
function addCol(){const e=document.getElementById('newCol'),n=e.value.trim();if(!n)return;D.cols.push(n);e.value='';save();render();renderCols()}
function renderCols(){
  document.getElementById('cols').innerHTML=D.cols.map((c,j)=>`<div class="row"><input value="${esc(c)}" onchange="D.cols[${j}]=this.value;save();render()"><button class="del" onclick="delCol(${j})">🗑</button></div>`).join('');
}
function delCol(j){ask('「'+D.cols[j]+'」の欄を消しますか？（全部の月から消えます）',()=>{
  D.cols.splice(j,1);D.months.forEach(m=>m.out.splice(j,1));save();render();renderCols()})}
function openSet(f){document.getElementById('goal').value=D.goal||'';renderCols();document.getElementById('mSet').classList.add('on');if(f===true)setTimeout(()=>document.getElementById('newCol').focus(),50)}
function closeSet(){D.goal=num(document.getElementById('goal').value);save();document.getElementById('mSet').classList.remove('on');summary()}

let curTab=0;
function tab(n){curTab=n;if(n===0)render();['list','tbl'].forEach((id,i)=>document.getElementById(id).style.display=i===n?'':'none');
  document.getElementById('tb0').classList.toggle('on',n===0);document.getElementById('tb1').classList.toggle('on',n===1);
  if(n===1)renderTbl();window.scrollTo(0,0)}
function renderTbl(){
  const T=document.getElementById('tbl');
  if(!D.months.length){T.innerHTML='<div class="empty">下の「＋ 次の月を追加」から<br>月を追加してください</div>';return}
  const idx=D.months.map((_,i)=>i).sort((a,b)=>D.months[a].ym<D.months[b].ym?-1:1);
  const rows=idx.map(i=>{const m=D.months[i];
    return '<tr><td><input type="month" class="tm" value="'+esc(m.ym)+'" onchange="if(this.value){D.months['+i+'].ym=this.value;save();render()}"></td>'+
    '<td><input class="ti inc" inputmode="numeric" value="'+esc(m.inc)+'" placeholder="0" oninput="tblSet('+i+',\'inc\',0,this)"></td>'+
    D.cols.map((_,j)=>'<td><input class="ti" inputmode="numeric" value="'+esc(m.out[j]||'')+'" placeholder="0" oninput="tblSet('+i+',\'out\','+j+',this)"></td>').join('')+
    '<td></td><td class="os" id="ro'+i+'"></td><td id="rt'+i+'"></td><td><button class="del" onclick="delMonth('+i+')">🗑</button></td></tr>'}).join('');
  T.innerHTML='<div class="tblwrap"><table><thead><tr><th>月</th><th><input class="thi inc" value="'+esc(D.incLabel||'収入')+'" onchange="D.incLabel=this.value.trim()||\'収入\';save();render()"></th>'+
    D.cols.map((c,j)=>'<th><div class="thc"><input class="thi" value="'+esc(c)+'" onchange="renCol('+j+',this)"><button class="x" onclick="delCol('+j+')">✕</button></div></th>').join('')+
    '<th><input class="thi new" placeholder="＋欄を追加" onchange="newColTbl(this)"></th><th>支出計</th><th>合計</th><th></th></tr></thead><tbody>'+rows+
    '<tr class="sumrow"><td>総計</td><td class="inc" id="sumInc"></td>'+D.cols.map((_,j)=>'<td id="sumC'+j+'"></td>').join('')+'<td></td><td class="os" id="sumO"></td><td id="sumT"></td><td></td></tr></tbody></table></div>'+
    '<div class="note">項目名・数字のマスはタップすると直接入力できます。右の「＋欄を追加」に名前を入れると欄が増えます。✕で欄を消せます。表が入りきらないときは横にスクロールできます。</div>';
  tblSums();
}
function renCol(j,el){const v=el.value.trim();if(!v){el.value=D.cols[j];return}D.cols[j]=v;save();render()}
function newColTbl(el){const v=el.value.trim();if(!v)return;D.cols.push(v);save();render();
  setTimeout(()=>{const w=document.querySelector('.tblwrap');if(w)w.scrollLeft=w.scrollWidth},30)}
function tblSet(i,k,j,el){
  const m=D.months[i];
  if(k==='inc')m.inc=el.value;else m.out[j]=el.value;
  save();tblSums();summary();
}
function tblSums(){
  let sInc=0,sOut=D.cols.map(()=>0),sO=0,sT=0;
  D.months.forEach((m,i)=>{const inc=num(m.inc),o=outSum(m),t=inc-o;sInc+=inc;sO+=o;sT+=t;
    D.cols.forEach((_,j)=>sOut[j]+=num(m.out[j]||0));
    const ro=document.getElementById('ro'+i),rt=document.getElementById('rt'+i);
    if(ro)ro.textContent=yen(o);
    if(rt){rt.className=t<0?'minus':'plus';rt.innerHTML='<b>'+yen(t)+'</b>'}});
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=yen(v)};
  set('sumInc',sInc);sOut.forEach((v,j)=>set('sumC'+j,v));set('sumO',sO);
  const st=document.getElementById('sumT');if(st){st.className=sT<0?'minus':'plus';st.textContent=yen(sT)}
}
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function pipe(u8,Stream,kind){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new Stream(kind))).arrayBuffer())}
async function encData(){const u=new TextEncoder().encode(JSON.stringify(D));
  if(window.CompressionStream){try{return 'z'+b64u(await pipe(u,CompressionStream,'deflate'))}catch(e){}}
  return 'j'+b64u(u)}
async function decData(t){let u=ub64(t.slice(1));if(t[0]==='z')u=await pipe(u,DecompressionStream,'deflate');return JSON.parse(new TextDecoder().decode(u))}
let shareLink='';
async function openShare(){shareLink=location.href.split('#')[0]+'#d='+await encData();
  document.getElementById('shareUrl').value=shareLink;document.getElementById('copyBtn').textContent='コピー';
  document.getElementById('sendBtn').style.display=navigator.share?'':'none';
  document.getElementById('mShare').classList.add('on')}
function closeShare(){document.getElementById('mShare').classList.remove('on')}
async function copyShare(){const b=document.getElementById('copyBtn');
  try{await navigator.clipboard.writeText(shareLink);b.textContent='コピーしました ✓'}
  catch(e){const t=document.getElementById('shareUrl');t.focus();t.select();try{document.execCommand('copy');b.textContent='コピーしました ✓'}catch(_){b.textContent='長押しでコピーしてください'}}}
async function sendShare(){try{await navigator.share({title:'貯金アプリのデータ',url:shareLink})}catch(e){}}
async function loadFromHash(){
  const h=location.hash;if(!h.startsWith('#d='))return;
  history.replaceState(null,'',location.pathname+location.search);
  try{const nd=await decData(h.slice(3));
    if(!nd||!Array.isArray(nd.months)||!Array.isArray(nd.cols))throw 0;
    const go=()=>{D=nd;save();render()};
    if(!D.months.some(m=>num(m.inc)||(m.out||[]).some(v=>num(v))))go();
    else ask('共有されたデータ（'+nd.months.length+'か月分）を読み込みますか？この端末の今のデータは置き換わります。',go,'読み込む');
  }catch(e){alert('共有URLを読み込めませんでした。URLが途中で切れていないか確かめてください。')}
}
if(!D.months.length)addMonth();else render();
loadFromHash();addEventListener("hashchange",loadFromHash);
</script>
</body>
</html>
