<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目標達成マネージャー</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#1c2230">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<style id="appcss">
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--sub:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ok:#16a34a;--warn:#ea580c;--bad:#dc2626;--off:#9ca3af}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 14px 10px}
.mrow{display:flex;align-items:center;justify-content:space-between}
.mrow button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;width:40px;height:36px;font-size:18px}
.mtitle{font-size:19px;font-weight:700}
.sub{color:var(--sub);font-size:12.5px}
header .sub{color:#cbd5e1;text-align:center;margin-top:4px}
.save{font-size:11px;text-align:center;color:#94a3b8;margin-top:2px;min-height:14px}
main{padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.iname{font-weight:700;font-size:16px}
.big{font-size:34px;font-weight:800;line-height:1.1}
.big small{font-size:14px;font-weight:600;color:var(--sub);margin-left:3px}
.flex{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 6px;position:relative}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.stat{background:var(--bg);border-radius:10px;padding:7px 8px}
.stat div:first-child{font-size:11px;color:var(--sub)}
.stat div:last-child{font-weight:700;font-size:14.5px}
.step{display:flex;align-items:center;gap:6px;margin-top:10px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;color:var(--ink)}
.step input{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);text-align:center;font-size:18px;font-weight:700;min-width:0}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:#e0e7ff;color:var(--acc)}
.tag.ok{background:#dcfce7;color:var(--ok)}.tag.warn{background:#ffedd5;color:var(--warn)}.tag.bad{background:#fee2e2;color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--bg);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;padding:0}
.cal .d.off{background:#e5e7eb;color:var(--off)}
.cal .d.today{border-color:var(--acc)}
.cal .d.sel{background:var(--acc);color:#fff}
.cal .d em{font-style:normal;font-size:9px;font-weight:700;margin-top:1px}
.cal .d.has em{color:var(--ok)}.cal .d.sel em{color:#fff}
.btn{display:block;width:100%;height:46px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:700;margin-top:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #fecaca}
.field{margin-top:10px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font-size:16px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;height:32px;min-width:36px;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:28px 10px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border:0}
.drow input{width:110px;height:38px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;vertical-align:middle;margin-left:4px}.seg button{border:0;background:#fff;font-size:11.5px;padding:4px 9px;color:var(--sub)}.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.sel{height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px;padding:0 8px;min-width:0}
.gr{padding:10px 0;border-bottom:1px solid var(--line)}.gr:last-child{border:0}
.gbar{position:relative;height:26px;background:var(--bg);border-radius:8px;margin:6px 0 4px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:8px}
.gpct{position:absolute;right:8px;top:0;line-height:26px;font-size:12px;font-weight:800;color:var(--ink)}
.gcut,.gideal{position:absolute;top:0;bottom:0;width:2px}.gcut{background:var(--bad)}.gideal{background:var(--ink);opacity:.55}
.gwrap{position:relative;margin:6px 0 4px}
.gwrap>.gbar{margin:0}
.gwrap>.gcut,.gwrap>.ggoal{position:absolute;top:-3px;height:32px;width:2px;border-radius:1px}
.gwrap>.gcut{background:var(--bad)}.gwrap>.ggoal{background:var(--ink)}
.glab{position:relative;margin-top:3px}
.gl{position:absolute;font-size:10.5px;white-space:nowrap;line-height:14px}
.gcutl{color:var(--bad);font-weight:700}.ggoall{color:var(--ink)}
.sbars{margin:2px 0 6px;padding:6px 8px;background:#f8fafc;border-radius:8px}
.sbr{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center;gap:8px;font-size:12px;padding:2px 0}
.sbn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbc{font-style:normal;font-size:9.5px;color:#fff;background:var(--bad);border-radius:4px;padding:0 3px;margin-right:3px;vertical-align:1px}
.sbt{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.sbt i{display:block;height:100%;background:#94a3b8;border-radius:4px}.sbt i.on{background:#f87171}.sbt i.oth{background:#cbd5e1}
.sbq{font-weight:700;white-space:nowrap}.sbq small{font-weight:400;color:var(--sub)}
.ptc{margin-top:8px;background:#f8fafc;border-radius:10px;padding:8px 10px}
.ptn{font-size:18px}
.ptbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:5px 0 4px}.ptbar i{display:block;height:100%;border-radius:4px}
.offbtn{border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;padding:0 14px;font-size:14px;font-weight:700;color:var(--ink)}
.offbtn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.omcard{box-shadow:0 0 0 2px var(--bad)}
.omhint{margin-top:10px;background:#fef2f2;color:#991b1b;border-radius:10px;padding:8px 10px;font-size:12.5px}
.cuthead{text-align:center}
.cuthead.all{background:#f0fdf4;box-shadow:0 0 0 2px var(--ok)}
.cutbig{font-size:44px;font-weight:800;line-height:1.1;margin:2px 0 6px}.cutbig small{font-size:16px;color:var(--sub);font-weight:700}
.cutsum{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-weight:700}
.cb{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.cb.ok{background:#dcfce7;color:var(--ok)}.cb.pace{background:#e0e7ff;color:var(--acc)}.cb.bad{background:#fee2e2;color:var(--bad)}
.crow{padding:10px 0;border-bottom:1px solid var(--line)}.crow:last-child{border:0}
.cnum{font-size:20px}
.cbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:5px 0 4px}
.cbar i{display:block;height:100%;border-radius:4px}.cbar i.ok{background:var(--ok)}.cbar i.pace{background:var(--acc)}.cbar i.bad,.cbar i.ng{background:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:middle}
nav button{font-size:11px}
.ihead{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;margin-top:4px;font-size:15px;color:var(--ink)}
.ihead>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.chev{font-size:12px;color:var(--acc);white-space:nowrap;font-weight:700}
.ibody{background:#f8fafc;border-radius:12px;padding:2px 10px 10px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.mbox{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px}
.mbox h3{margin:0 0 6px;font-size:17px}
.tin{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;margin-top:10px;font-family:inherit}
textarea.tin{font-size:12px;word-break:break-all}
.mrow2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--bad);font-weight:700;gap:1px;min-width:38px}
.ck input{width:22px;height:22px;margin:0;accent-color:var(--bad)}
.notice{background:#fff7ed;color:#9a3412;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app"></div>
<script id="appjs">
(function(){
const $app=document.getElementById('app');
const LS='target_v1';
let S;
try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
if(!S||typeof S!=='object')S={months:{}};
if(!S.months)S.months={};

const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const curYM=todayKey.slice(0,7);
let view={ym:curYM,tab:'today',sel:todayKey};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ja-JP');
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- データ構造 ----
// S.items: 全月共通の項目 [{id,name,unit,cut:{fixed,value},goal:{fixed,value}}]
// S.months[ym]: {off:[], entries:{日付:{id:値}}, t:{id:{cut,goal}}}  ※月ごとの目標はtに入る
if(!S.items){ // 旧形式からの移行
  S.items=[];const keys=Object.keys(S.months).sort();const last=keys.length?S.months[keys[keys.length-1]]:null;
  if(last&&last.items)S.items=last.items.map(i=>({id:i.id,name:i.name,unit:i.unit,cut:{fixed:true,value:''},goal:{fixed:false,value:''}}));
  for(const k of keys){const m=S.months[k];m.t=m.t||{};(m.items||[]).forEach(i=>{m.t[i.id]={goal:i.target}});delete m.items;}
}
const KINDS=[['cut','足切り'],['goal','目標']];
// 旧「成果項目」→ 目標の項目のポイント設定に統合
if(S.acts){const map={};
  for(const a of S.acts){const it=a.link&&S.items.find(i=>i.id===a.link);
    if(it){if(it.pt===undefined||it.pt==='')it.pt=a.pt;map[a.id]={id:it.id,linked:true};}
    else{S.items.push({id:a.id,name:a.name,unit:a.unit,pt:a.pt,cut:{fixed:true,value:''},goal:{fixed:true,value:''}});map[a.id]={id:a.id,linked:false};}}
  for(const ym in S.months){const m=S.months[ym];for(const k in (m.logs||{}))for(const r of m.logs[k]){if(r.a){const x=map[r.a];if(x){r.i=x.id;if(!x.linked){m.entries[k]=m.entries[k]||{};m.entries[k][x.id]=Number(m.entries[k][x.id]||0)+r.q;}}delete r.a;}}}
  delete S.acts;}
let lastAct=null,lastQty=1,lastSub=null;
const ptOf=it=>Number(it&&it.pt||0);
const subsOf=it=>(it&&Array.isArray(it.subs))?it.subs:[];
function logPt(it,r){const sb=subsOf(it).find(x=>x.id===r.s);return sb?Number(sb.pt||0):ptOf(it);}
const cutSet=it=>{const ids=subsOf(it).filter(x=>x.cut).map(x=>x.id);return ids.length?ids:null;};
const cutNames=it=>cutSet(it)?subsOf(it).filter(x=>x.cut).map(x=>x.name||'種類').join('・'):'';
const isYen=(it,k)=>k==='cut'&&it&&it.cut&&it.cut.mode==='yen';
const uOf=(it,k)=>isYen(it,k)?'円':esc(it.unit||'');
function logName(it,r){const sb=subsOf(it).find(x=>x.id===r.s);return esc(it.name)+(sb?`（${esc(sb.name||'種類')}）`:'');}
if(S.ptCut===undefined)S.ptCut=600;
function ptCutOf(){return S.ptCut===''||S.ptCut==null?null:Number(S.ptCut);}
function monthPts(ym,before){const m=monthOf(ym);let t=0;for(const k in (m.logs||{})){if(before&&k>=before)continue;for(const r of m.logs[k]){const it=S.items.find(x=>x.id===r.i);if(it)t+=r.q*logPt(it,r);}}return t;}
function logBlock(k){
  const ym=k.slice(0,7),m=monthOf(ym),L=(m.logs||{})[k]||[];
  const[,mm,dd]=k.split('-');const isToday=k===todayKey,ttl=isToday?'今日の成果':Number(mm)+'月'+Number(dd)+'日の成果';
  if(!S.items.length)return `<div class="card"><div class="iname">${ttl}</div><div class="sub" style="margin-top:6px">項目設定で項目（例：PayPayカード）と1件あたりのポイントを設定すると、ここで記録できます。</div><button class="btn ghost" data-tab="set">項目を設定する</button></div>`;
  let tot=0;
  const rows=L.map(r=>{const it=S.items.find(x=>x.id===r.i);if(!it)return '';const pp=logPt(it,r),p=r.q*pp;tot+=p;
    return `<div class="drow"><div><b>${logName(it,r)}</b> ${r.q}${esc(it.unit||'')}${r.y?`<span class="sub">（${fmt(r.y)}円）</span>`:''}</div><div class="flex"><span class="sub">${r.q}×${fmt(pp)}pt＝</span><b>${fmt(p)}pt</b><button class="mini" data-a="dellog" data-k="${k}" data-r="${r.id}">✕</button></div></div>`}).join('');
  const sel=S.items.some(a=>a.id===lastAct)?lastAct:S.items[0].id;
  return `<div class="card">
    <div class="between" style="align-items:center"><div class="iname">${ttl}</div><div style="text-align:right"><div class="big" style="font-size:26px;color:var(--acc)">${fmt(tot)}<small>pt</small></div></div></div>
    ${ptLine(ym)}
    <div class="flex" style="margin-top:10px;flex-wrap:wrap">
      <select id="la" class="sel" style="flex:2">${S.items.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name||'名前なし')}</option>`).join('')}</select>
      ${(()=>{const it=S.items.find(x=>x.id===sel),sb=subsOf(it);if(!sb.length)return '';const ss=sb.some(x=>x.id===lastSub)?lastSub:sb[0].id;return `<select id="ls" class="sel" style="flex:2">${sb.map(x=>`<option value="${x.id}" ${x.id===ss?'selected':''}>${esc(x.name||'種類')}</option>`).join('')}</select>`;})()}
      ${isYen(S.items.find(x=>x.id===sel),'cut')?`<input id="ly" class="sel" type="number" inputmode="numeric" placeholder="金額（円）" style="flex:2;width:0">`:''}
      <select id="lq" class="sel" style="flex:1">${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${i+1===lastQty?'selected':''}>${i+1}</option>`).join('')}</select>
      <button class="mini" data-a="addlog" data-k="${k}" style="height:44px;padding:0 14px;background:var(--acc);color:#fff;border:0;font-weight:700">追加</button>
    </div>
    <div id="lprev" class="sub" style="margin-top:6px"></div>
    <div style="margin-top:6px">${rows||'<div class="sub" style="padding:8px 0">まだ記録がありません</div>'}</div>
  </div>`;
}
function ptLine(ym){
  const tot=monthPts(ym),pc=ptCutOf(),mo=Number(ym.slice(5));
  if(pc===null)return `<div class="sub" style="text-align:right">${mo}月の合計 ${fmt(tot)}pt</div>`;
  const done=tot>=pc,rate=pc?tot/pc:0;let daily='';
  if(ym===curYM&&!done){const m=monthOf(ym);let rem=0;for(let d=1;d<=daysIn(ym);d++){const k=dkey(ym,d);if(k>=todayKey&&!m.off.includes(k))rem++;}
    if(rem){const need=Math.max(0,Math.ceil((pc-monthPts(ym,todayKey))/rem));daily=`今日の目安 <b>${fmt(need)}pt</b>`;}}
  return `<div class="ptc"><div class="between"><span class="sub">${mo}月の合計</span><span><b class="ptn">${fmt(tot)}</b><span class="sub"> / ${fmt(pc)}pt</span></span></div>
    <div class="ptbar"><i style="width:${Math.min(100,rate*100)}%;background:${done?'var(--ok)':'var(--bad)'}"></i></div>
    <div class="between sub"><span>${done?'<b style="color:var(--ok)">ポイント足切りクリア！</b>':`足切りまであと <b>${fmt(pc-tot)}pt</b>`}</span><span>${daily}</span></div></div>`;
}
function updPrev(){const it=S.items.find(x=>x.id===(document.getElementById('la')||{}).value),q=Number((document.getElementById('lq')||{}).value||1),e=document.getElementById('lprev');if(!it||!e)return;const r={s:(document.getElementById('ls')||{}).value},pp=logPt(it,r),sb=subsOf(it).find(x=>x.id===r.s);e.textContent=`${it.name}${sb?'（'+(sb.name||'種類')+'）':''} ${q}${it.unit||''} × ${fmt(pp)}pt ＝ ${fmt(q*pp)}pt（実績にも＋${q}）`;}
function monthOf(ym){return S.months[ym]||{off:[],entries:{},t:{},_tmp:true};}
function ensure(ym){const m=monthOf(ym);if(m._tmp){delete m._tmp;S.months[ym]=m;}m.t=m.t||{};return m;}
function daysIn(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function dkey(ym,d){return `${ym}-${pad(d)}`;}
function dow(k){return new Date(k.slice(0,4),k.slice(5,7)-1,k.slice(8)).getDay();}
function tval(ym,it,kind){
  const c=it[kind];if(!c)return null;
  const v=c.fixed?c.value:((monthOf(ym).t||{})[it.id]||{})[kind];
  return v===''||v===undefined||v===null?null:Number(v);
}

function calc(ym,item){
  const m=monthOf(ym),n=daysIn(ym);
  const work=[];for(let d=1;d<=n;d++){const k=dkey(ym,d);if(!m.off.includes(k))work.push(k);}
  let total=0,before=0,todayV=0;
  for(const k in m.entries){const v=Number(m.entries[k][item.id]||0);total+=v;if(ym===curYM){if(k<todayKey)before+=v;else if(k===todayKey)todayV=v;}}
  let yT=0,yB=0,yToday=0,fT=0,fB=0,fToday=0;const cs=cutSet(item);
  for(const k in (m.logs||{}))for(const x of m.logs[k]){if(x.i!==item.id)continue;if(cs&&!cs.includes(x.s))continue;
    const y=x.y||0;yT+=y;fT+=x.q;if(ym===curYM){if(k<todayKey){yB+=y;fB+=x.q;}else if(k===todayKey){yToday+=y;fToday+=x.q;}}}
  const r={total,work:work.length,todayV,yT,yToday,fT,cs:!!cs,t:{}};
  const remain=work.filter(k=>k>=todayKey).length,elapsed=work.filter(k=>k<=todayKey).length;
  if(ym===curYM){r.remain=remain;r.proj=elapsed?total/elapsed*work.length:0;r.ideal=work.length?elapsed/work.length:0;}
  for(const[kind]of KINDS){
    const T=tval(ym,item,kind);if(T===null)continue;
    const yen=isYen(item,kind),flt=kind==='cut'&&!!cs&&!yen;
    const tot=yen?yT:flt?fT:total,bef=yen?yB:flt?fB:before;
    const o={T,yen,flt,tot,now:yen?yToday:flt?fToday:todayV,rate:T?tot/T:0,left:Math.max(0,T-tot),done:tot>=T,proj:elapsed?tot/elapsed*work.length:0};
    if(ym===curYM)o.daily=remain?Math.max(0,Math.ceil((T-bef)/remain)):null;
    else if(ym>curYM)o.daily=work.length?Math.ceil(T/work.length):null;
    r.t[kind]=o;
  }
  return r;
}

function b64u(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function enc(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u(new Uint8Array(await new Response(st).arrayBuffer()));}catch(e){}}
  return 'j'+b64u(bytes);
}
async function dec(code){
  code=String(code).trim();const kind=code[0];let b=code.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const bin=atob(b),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  let txt;if(kind==='z'){const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));txt=await new Response(st).text();}else txt=new TextDecoder().decode(u8);
  return JSON.parse(txt);
}
function payload(ym){
  const m=monthOf(ym),n=daysIn(ym);let work=0,el=0;
  for(let d=1;d<=n;d++){const k=dkey(ym,d);if(m.off.includes(k))continue;work++;if(k<=todayKey)el++;}
  const items=S.items.map(it=>{const r=calc(ym,it);return{n:it.name||'名前なし',u:it.unit||'',c:r.t.cut?r.t.cut.T:null,cy:isYen(it,'cut')?1:0,ty:r.yT,ct:r.t.cut?r.t.cut.tot:null,cn:cutNames(it),sb:subStats(ym,it,r.total),g:r.t.goal?r.t.goal.T:null,t:r.total,p:ptOf(it)};});
  return{v:1,id:S.me.id,name:S.me.name,ym,at:Date.now(),items,pts:monthPts(ym),pc:ptCutOf(),work,el};
}

}

function applyCfg(c){
  const byName={};S.items.forEach(i=>{if(i.name)byName[i.name]=i;});
  const idMap={};
  S.items=c.items.map(x=>{const ex=byName[x.name];const id=ex?ex.id:x.id;idMap[x.id]=id;
    const subs=x.subs.map(sb=>{const es=ex&&subsOf(ex).find(v=>v.name===sb.name);return{id:es?es.id:sb.id,name:sb.name,pt:sb.pt,cut:sb.cut};});
    const goal=c.withGoal?x.goal:(ex&&ex.goal?ex.goal:{fixed:x.goal.fixed,value:''});
    return{id,name:x.name,unit:x.unit,pt:x.pt,subs,cut:x.cut,goal};});
  S.ptCut=c.ptCut;
  for(const ym in (c.t||{})){const m=ensure(ym);for(const oid in c.t[ym]){const id=idMap[oid]||oid;m.t[id]=Object.assign(m.t[id]||{},c.t[ym][oid]);}}
  changed();
}

const GC={done:'#ef4444',near:'#facc15',far:'#22c55e'};
function subStats(ym,it,total){
  const sb=subsOf(it);if(!sb.length)return [];
  const m=monthOf(ym),q={},y={};
  for(const k in (m.logs||{}))for(const r of m.logs[k]){if(r.i!==it.id)continue;q[r.s]=(q[r.s]||0)+r.q;y[r.s]=(y[r.s]||0)+(r.y||0);}
  const out=sb.map(x=>({n:x.name||'種類',q:q[x.id]||0,y:y[x.id]||0,c:x.cut?1:0}));
  const sum=out.reduce((a,b)=>a+b.q,0);if(total>sum)out.push({n:'種類なし',q:total-sum,y:0,c:0,o:1});
  return out;
}
function subBarsHtml(list,sc,u,yen){
  if(!list||!list.length)return '';
  return '<div class="sbars">'+list.map(x=>`<div class="sbr"><span class="sbn">${x.c?'<i class="sbc">足切り</i>':''}${esc(x.n)}</span><span class="sbt"><i style="width:${Math.min(100,x.q/sc*100)}%" class="${x.c?'on':''}${x.o?' oth':''}"></i></span><span class="sbq">${fmt(x.q)}${u}${yen&&x.y?`<small> ${fmt(x.y)}円</small>`:''}</span></div>`).join('')+'</div>';
}
function cutView(ym,m){
  const isCur=ym===curYM,past=ym<curYM,mo=Number(ym.slice(5));
  let work=0,el=0,rem=0;for(let d=1;d<=daysIn(ym);d++){const k=dkey(ym,d);if(m.off.includes(k))continue;work++;if(k<=todayKey)el++;if(k>=todayKey)rem++;}
  const rows=[];
  const pc=ptCutOf();
  if(pc!==null){const tot=monthPts(ym),bef=monthPts(ym,todayKey);
    rows.push({n:'ポイント',sub:'今日の成果の合計',T:pc,tot,u:'pt',done:tot>=pc,left:Math.max(0,pc-tot),daily:isCur&&rem?Math.max(0,Math.ceil((pc-bef)/rem)):null,proj:isCur&&el?tot/el*work:null});}
  for(const it of S.items){const r=calc(ym,it),c=r.t.cut;if(!c)continue;
    rows.push({n:it.name||'名前なし',sub:c.yen?(cutSet(it)?cutNames(it)+'の売上合計':'売上合計'):(c.flt?cutNames(it)+'のみ':''),T:c.T,tot:c.tot,u:uOf(it,'cut'),done:c.done,left:c.left,daily:isCur?c.daily:null,proj:isCur?c.proj:null});}
  if(!rows.length)return `<div class="card empty">足切りが設定されていません。<br>項目設定で、項目の足切りやポイントの足切りを入れてください。<button class="btn" data-tab="set">項目設定へ</button></div>`;
  const st=x=>x.done?'ok':(isCur&&x.proj!=null&&x.proj>=x.T)?'pace':(past?'ng':'bad');
  const cnt={ok:0,pace:0,bad:0,ng:0};rows.forEach(x=>cnt[st(x)]++);
  const allOk=cnt.ok===rows.length;
  let h=`<div class="card cuthead ${allOk?'all':''}">
    <div class="sub">${mo}月の足切り</div>
    <div class="cutbig">${cnt.ok}<small> / ${rows.length} クリア</small></div>
    <div class="cutsum">${allOk?'🎉 全部クリア！':`<span class="cb ok">クリア ${cnt.ok}</span>${isCur?`<span class="cb pace">ペースOK ${cnt.pace}</span><span class="cb bad">ペース不足 ${cnt.bad}</span>`:`<span class="cb bad">未達 ${cnt.ng+cnt.bad}</span>`}`}</div>
    ${isCur?`<div class="sub" style="margin-top:6px">残り出勤日 ${rem}日（今日を含む）</div>`:''}
  </div>`;
  const order={bad:0,ng:0,pace:1,ok:2};
  rows.sort((a,b)=>order[st(a)]-order[st(b)]);
  h+='<div class="card" style="padding:6px 14px">'+rows.map(x=>{const s_=st(x),rate=x.T?Math.min(100,x.tot/x.T*100):0;
    const badge=s_==='ok'?'<span class="cb ok">✓ クリア</span>':s_==='pace'?'<span class="cb pace">ペースOK</span>':s_==='ng'?'<span class="cb bad">未達</span>':'<span class="cb bad">ペース不足</span>';
    return `<div class="crow">
      <div class="between"><div><b>${esc(x.n)}</b>${x.sub?`<span class="sub">　${esc(x.sub)}</span>`:''}</div>${badge}</div>
      <div class="between" style="margin-top:4px"><span><b class="cnum">${fmt(x.tot)}</b><span class="sub"> / ${fmt(x.T)}${x.u}</span></span><span class="sub">${x.done?'':`あと <b style="color:var(--ink)">${fmt(x.left)}${x.u}</b>`}</span></div>
      <div class="cbar"><i class="${s_}" style="width:${rate}%"></i></div>
      ${isCur&&!x.done?`<div class="sub">今日の目安 <b style="color:var(--ink)">${x.daily==null?'—':fmt(x.daily)+x.u}</b>${x.proj!=null?`　着地予測 ${fmt(Math.round(x.proj))}${x.u}`:''}</div>`:''}
    </div>`;}).join('')+'</div>';
  h+=`<div class="sub" style="text-align:center">ペースOK＝今のペースなら月末に足切りを超える見込み</div>`;
  return h;
}
function gBar(base,g,c,cu,color,cn,subs,u){
  // 線（足切り・個人目標）と、その下のラベル
  const same=c&&!c.yen&&(!g||!g.yen);
  const sc=Math.max(base.T,same?c.T:0,base.tot)*1.08||1;
  const lines=[];
  if(c&&same)lines.push({x:c.T/sc*100,cls:'gcut',txt:`足切り ${fmt(c.T)}${cu}${cn?`（${esc(cn)}）`:''}`});
  if(g)lines.push({x:g.T/sc*100,cls:'ggoal',txt:'個人目標'});
  const two=lines.length===2&&Math.abs(lines[0].x-lines[1].x)<34;
  const lab=lines.map((l,i)=>{const tf=l.x>82?'translateX(-100%)':l.x<18?'translateX(0)':'translateX(-50%)';return `<span class="gl ${l.cls}l" style="left:${l.x}%;top:${two&&i===1?16:0}px;transform:${tf}">${l.txt}</span>`;}).join('');
  return `<div class="gwrap"><div class="gbar"><i style="width:${Math.min(100,base.tot/sc*100)}%;background:${color}"></i></div>${lines.map(l=>`<b class="${l.cls}" style="left:${l.x}%"></b>`).join('')}<div class="glab" style="height:${two?32:lines.length?16:0}px">${lab}</div></div>${base.yen?'':subBarsHtml(subs,sc,u,c&&c.yen)}`;
}
function graphView(ym,m){

    <div style="margin-top:8px">${rows}</div>
    <div class="sub" style="margin-top:10px;line-height:1.7">赤＝達成（100%以上）／黄＝もう少し（70%以上）／緑＝まだまだ（70%未満）<br>縦線：<span style="color:var(--bad);font-weight:700">赤</span>＝足切り、<b>黒</b>＝個人目標</div>
  </div>${sendCard()}`;
}
